    // =========================================================================
    // 8. 右上角 10 公尺等高線小地圖（獨立平滑山地高程場，消除路基凹槽）
    // =========================================================================
    const minimapCanvas = document.getElementById('minimap-canvas');
    const minimapCtx = minimapCanvas.getContext('2d');
    const minimapBgCanvas = document.createElement('canvas');
    minimapBgCanvas.width = 336;
    minimapBgCanvas.height = 256;

    let mapBounds = { minX: -1200, maxX: 1450, minZ: -520, maxZ: 680 };

    function getSmoothMapElevationAt(x, z) {
      const gx = Math.floor(x / GRID_CELL);
      const gz = Math.floor(z / GRID_CELL);
      let weightedSum = 0;
      let weightTotal = 0;

      for (let dx = -4; dx <= 4; dx++) {
        for (let dz = -4; dz <= 4; dz++) {
          const bucket = roadSpatialGrid.get(`${gx + dx},${gz + dz}`);
          if (!bucket) continue;
          for (let k = 0; k < bucket.length; k += 3) {
            const rp = bucket[k];
            const distSq = (x - rp.x) * (x - rp.x) + (z - rp.z) * (z - rp.z);
            const w = 1.0 / (distSq + 2600.0);
            weightedSum += (rp.y + BASE_ELEV) * w;
            weightTotal += w;
          }
        }
      }

      const eastFactor = THREE.MathUtils.clamp((x + 1250) / 2600, 0, 1);
      const southFactor = THREE.MathUtils.clamp((z + 550) / 1150, 0, 1);
      let macroElev = 310 + Math.pow(eastFactor, 1.25) * 615 + southFactor * 42;
      macroElev += Math.sin(x * 0.0042) * 26 + Math.cos(z * 0.0048) * 22;

      if (weightTotal > 0) {
        const roadElev = weightedSum / weightTotal;
        const blend = THREE.MathUtils.clamp(weightTotal * 3200.0, 0, 0.92);
        return THREE.MathUtils.lerp(macroElev, roadElev, blend);
      }
      return macroElev;
    }

    function worldToMinimap(wx, wz) {
      const pad = 22;
      const w = minimapBgCanvas.width - pad * 2;
      const h = minimapBgCanvas.height - pad * 2;
      const spanX = mapBounds.maxX - mapBounds.minX || 1;
      const spanZ = mapBounds.maxZ - mapBounds.minZ || 1;
      const scale = Math.min(w / spanX, h / spanZ);
      const offsetX = pad + (w - spanX * scale) * 0.5;
      const offsetY = pad + (h - spanZ * scale) * 0.5;
      return {
        x: offsetX + (wx - mapBounds.minX) * scale,
        y: offsetY + (wz - mapBounds.minZ) * scale
      };
    }

    function bakeMinimapBackground() {
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      roadSamples.forEach(s => {
        if (s.pos.x < minX) minX = s.pos.x;
        if (s.pos.x > maxX) maxX = s.pos.x;
        if (s.pos.z < minZ) minZ = s.pos.z;
        if (s.pos.z > maxZ) maxZ = s.pos.z;
      });
      mapBounds = { minX: minX - 140, maxX: maxX + 140, minZ: minZ - 140, maxZ: maxZ + 140 };

      const w = minimapBgCanvas.width;
      const h = minimapBgCanvas.height;
      const ctx = minimapBgCanvas.getContext('2d');
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      const pad = 22;
      const innerW = w - pad * 2;
      const innerH = h - pad * 2;
      const spanX = mapBounds.maxX - mapBounds.minX;
      const spanZ = mapBounds.maxZ - mapBounds.minZ;
      const scale = Math.min(innerW / spanX, innerH / spanZ);
      const offsetX = pad + (innerW - spanX * scale) * 0.5;
      const offsetY = pad + (innerH - spanZ * scale) * 0.5;

      const elevGrid = new Float32Array(w * h);
      for (let py = 0; py < h; py++) {
        const wz = mapBounds.minZ + (py - offsetY) / scale;
        for (let px = 0; px < w; px++) {
          const wx = mapBounds.minX + (px - offsetX) / scale;
          elevGrid[py * w + px] = getSmoothMapElevationAt(wx, wz);
        }
      }

      // 繪製山地漸層底色與 10m 細線 / 50m 中線 / 100m 計曲線
      for (let py = 0; py < h; py++) {
        for (let px = 0; px < w; px++) {
          const idx = py * w + px;
          const e = elevGrid[idx];
          const t = THREE.MathUtils.clamp((e - 300) / 680, 0, 1);

          let r = 16 + t * 24;
          let g = 34 + t * 44;
          let b = 28 + t * 22;

          if (px > 0 && px < w - 1 && py > 0 && py < h - 1) {
            const gx = (elevGrid[idx + 1] - elevGrid[idx - 1]) * 0.5;
            const gy = (elevGrid[idx + w] - elevGrid[idx - w]) * 0.5;
            const grad = Math.hypot(gx, gy) || 0.001;

            const d10 = Math.abs(((e % 10) + 10) % 10 - 5);
            const dist10 = (5 - d10) / grad;

            const d50 = Math.abs(((e % 50) + 50) % 50 - 25);
            const dist50 = (25 - d50) / grad;

            const d100 = Math.abs(((e % 100) + 100) % 100 - 50);
            const dist100 = (50 - d100) / grad;

            if (dist100 < 1.15) {
              const a = THREE.MathUtils.clamp(1.0 - dist100 / 1.15, 0, 1) * 0.72;
              r = r * (1 - a) + 217 * a;
              g = g * (1 - a) + 166 * a;
              b = b * (1 - a) + 84 * a;
            } else if (dist50 < 0.95) {
              const a = THREE.MathUtils.clamp(1.0 - dist50 / 0.95, 0, 1) * 0.46;
              r = r * (1 - a) + 163 * a;
              g = g * (1 - a) + 190 * a;
              b = b * (1 - a) + 140 * a;
            } else if (dist10 < 0.75) {
              const a = THREE.MathUtils.clamp(1.0 - dist10 / 0.75, 0, 1) * 0.25;
              r = r * (1 - a) + 120 * a;
              g = g * (1 - a) + 155 * a;
              b = b * (1 - a) + 125 * a;
            }
          }

          const p4 = idx * 4;
          data[p4] = r;
          data[p4 + 1] = g;
          data[p4 + 2] = b;
          data[p4 + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // 繪製 162 甲線賽道軌跡
      ctx.beginPath();
      for (let i = 0; i <= NUM_SAMPLES; i += 6) {
        const pt = worldToMinimap(roadSamples[i].pos.x, roadSamples[i].pos.z);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.lineWidth = 5.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2.6;
      ctx.stroke();

      // 標示 36 個彎道紅點
      bendMarkers.forEach(bm => {
        const s = roadSamples[bm.sampleIndex];
        const pt = worldToMinimap(s.pos.x, s.pos.z);
        ctx.fillStyle = bm.bendNum === 36 ? '#ef4444' : '#f59e0b';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, bm.bendNum === 36 ? 3.5 : 1.8, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    bakeMinimapBackground();

    function renderMinimap(carPos, carHeading) {
      minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
      minimapCtx.drawImage(minimapBgCanvas, 0, 0);

      const pt = worldToMinimap(carPos.x, carPos.z);
      minimapCtx.save();
      minimapCtx.translate(pt.x, pt.y);
      minimapCtx.rotate(Math.PI - carHeading);
      minimapCtx.fillStyle = '#ef4444';
      minimapCtx.strokeStyle = '#ffffff';
      minimapCtx.lineWidth = 1.6;
      minimapCtx.beginPath();
      minimapCtx.moveTo(0, -7.5);
      minimapCtx.lineTo(5.5, 5.5);
      minimapCtx.lineTo(0, 2.5);
      minimapCtx.lineTo(-5.5, 5.5);
      minimapCtx.closePath();
      minimapCtx.fill();
      minimapCtx.stroke();
      minimapCtx.restore();
    }

    // =========================================================================
    // 9. 車輛物理狀態、快速定位傳送、互動控制與主渲染迴圈
    // =========================================================================
    const START_SAMPLE_INDEX = 14; // 第 1 彎前起始位置
    const carState = {
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      heading: 0,
      steerAngle: 0,
      speed: 0,
      nearestSampleIdx: START_SAMPLE_INDEX,
      lateralOffset: 0,
      wheelSpin: 0,
      roll: 0,
      pitch: 0,
      driftScore: 0,
      maxSpeedKmh: 0,
      elapsedTime: 0,
      raceStarted: false,
      raceFinished: false
    };

    const keys = { forward: false, backward: false, left: false, right: false, handbrake: false };
    let cameraMode = 0; // 0: 標準追尾, 1: 引擎蓋第一人稱, 2: 遠距俯瞰
    let cameraShake = 0;
    let toastTimeout = null;

    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const textEl = document.getElementById('toast-text');
      textEl.textContent = msg;
      banner.classList.remove('opacity-0', '-translate-y-2');
      banner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-2');
      }, 2800);
    }

    function teleportToSample(sampleIdx, resetStats = false) {
      const idx = THREE.MathUtils.clamp(Math.round(sampleIdx), 0, NUM_SAMPLES - 1);
      const s = roadSamples[idx];
      carState.pos.copy(s.pos);
      carState.vel.set(0, 0, 0);
      carState.speed = 0;
      carState.steerAngle = 0;
      carState.heading = Math.atan2(s.flatTangent.x, s.flatTangent.z);
      carState.nearestSampleIdx = idx;
      carState.lateralOffset = 0;
      carState.roll = 0;

      // 重設該位置之後的地標提示狀態
      landmarkTriggers.forEach(lt => {
        lt.triggered = lt.index < idx;
      });

      if (resetStats) {
        carState.driftScore = 0;
        carState.maxSpeedKmh = 0;
        carState.elapsedTime = 0;
        carState.raceStarted = false;
        carState.raceFinished = false;
        document.getElementById('finish-modal').classList.add('hidden');
        document.getElementById('finish-modal').classList.remove('flex');
      }

      // 立即同步攝影機位置避免瞬間拉扯
      const backDir = new THREE.Vector3(-Math.sin(carState.heading), 0, -Math.cos(carState.heading));
      camera.position.copy(carState.pos).addScaledVector(backDir, 6.8).add(new THREE.Vector3(0, 2.7, 0));
    }

    function recoverCarOnRoad() {
      const s = roadSamples[carState.nearestSampleIdx];
      carState.pos.copy(s.pos);
      carState.vel.set(0, 0, 0);
      carState.speed = 0;
      carState.steerAngle = 0;
      carState.heading = Math.atan2(s.flatTangent.x, s.flatTangent.z);
      carState.lateralOffset = 0;
      showToast('🔄 已在目前路段原地回正');
    }

    function resetToStart() {
      teleportToSample(START_SAMPLE_INDEX, true);
      showToast('🏁 已回到起始點（西門大將軍前）');
    }

    // 路線進度條點擊／拖曳快速傳送
    const progressTrack = document.getElementById('hud-progress-track');
    let isDraggingProgress = false;

    function handleProgressScrub(clientX) {
      const rect = progressTrack.getBoundingClientRect();
      const ratio = THREE.MathUtils.clamp((clientX - rect.left) / rect.width, 0, 1);
      const targetIdx = Math.round(ratio * (NUM_SAMPLES - 4));
      teleportToSample(targetIdx, false);

      let activeBend = 0;
      for (let i = 0; i < bendMarkers.length; i++) {
        if (targetIdx >= bendMarkers[i].sampleIndex - 6) activeBend = bendMarkers[i].bendNum;
        else break;
      }
      const distKm = ((targetIdx / NUM_SAMPLES) * (totalTrackLength / 1000)).toFixed(1);
      const elev = Math.round(roadSamples[targetIdx].realElev);
      const bendLabel = activeBend > 0 ? `第 ${activeBend} 彎` : '起點前';
      showToast(`📍 已傳送至 ${distKm} km（${bendLabel} · 海拔 ${elev}m）`);
    }

    progressTrack.addEventListener('pointerdown', e => {
      isDraggingProgress = true;
      progressTrack.setPointerCapture(e.pointerId);
      handleProgressScrub(e.clientX);
    });
    progressTrack.addEventListener('pointermove', e => {
      if (isDraggingProgress) handleProgressScrub(e.clientX);
    });
    progressTrack.addEventListener('pointerup', e => {
      isDraggingProgress = false;
      progressTrack.releasePointerCapture(e.pointerId);
    });

    // 鍵盤與按鈕事件綁定
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.forward = true;
      if (k === 's' || e.key === 'ArrowDown') keys.backward = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.code === 'Space') { e.preventDefault(); keys.handbrake = true; }
      if (k === 'c') cycleCamera();
      if (k === 'f') cycleFog();
      if (k === 'r') recoverCarOnRoad();
      if (k === 'h') resetToStart();
    });

    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.forward = false;
      if (k === 's' || e.key === 'ArrowDown') keys.backward = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.right = false;
      if (e.code === 'Space') keys.handbrake = false;
    });

    function cycleCamera() {
      cameraMode = (cameraMode + 1) % 3;
      const names = ['標準追尾視角', '車頭引擎蓋視角', '高空廣角俯瞰'];
      showToast(`🎥 切換至：${names[cameraMode]}`);
    }

    function cycleFog() {
      currentFogIdx = (currentFogIdx + 1) % fogLevels.length;
      const fl = fogLevels[currentFogIdx];
      scene.fog.density = fl.density;
      scene.fog.color.setHex(fl.color);
      scene.background.setHex(fl.color);
      showToast(`🌫️ 山嵐濃度：${fl.label}`);
    }

    document.getElementById('btn-camera').addEventListener('click', cycleCamera);
    document.getElementById('btn-fog').addEventListener('click', cycleFog);
    document.getElementById('btn-recover').addEventListener('click', recoverCarOnRoad);
    document.getElementById('btn-home').addEventListener('click', resetToStart);
    document.getElementById('btn-replay').addEventListener('click', resetToStart);
    document.getElementById('btn-keep-driving').addEventListener('click', () => {
      document.getElementById('finish-modal').classList.add('hidden');
      document.getElementById('finish-modal').classList.remove('flex');
    });

    // 手機觸控綁定
    function bindTouchHold(btnId, keyName) {
      const el = document.getElementById(btnId);
      if (!el) return;
      const onDown = e => { e.preventDefault(); keys[keyName] = true; el.classList.add('active'); };
      const onUp = e => { e.preventDefault(); keys[keyName] = false; el.classList.remove('active'); };
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointerleave', onUp);
      el.addEventListener('pointercancel', onUp);
    }
    bindTouchHold('touch-left', 'left');
    bindTouchHold('touch-right', 'right');
    bindTouchHold('touch-gas', 'forward');
    bindTouchHold('touch-brake', 'backward');
    bindTouchHold('touch-handbrake', 'handbrake');
    document.getElementById('touch-cam')?.addEventListener('click', cycleCamera);
    document.getElementById('touch-recover')?.addEventListener('click', recoverCarOnRoad);
    document.getElementById('touch-home')?.addEventListener('click', resetToStart);

    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${s < 10 ? '0' : ''}${s.toFixed(1)}`;
    }

    // 尋找最近道路投影點（局部窗口搜尋＋全域備援）
    function projectCarOntoRoad() {
      let bestIdx = carState.nearestSampleIdx;
      let bestDistSq = Infinity;
      const winStart = Math.max(0, carState.nearestSampleIdx - 28);
      const winEnd = Math.min(NUM_SAMPLES, carState.nearestSampleIdx + 28);

      for (let i = winStart; i <= winEnd; i++) {
        const p = roadSamples[i].pos;
        const d2 = (carState.pos.x - p.x) ** 2 + (carState.pos.z - p.z) ** 2 + ((carState.pos.y - p.y) * 1.4) ** 2;
        if (d2 < bestDistSq) {
          bestDistSq = d2;
          bestIdx = i;
        }
      }

      if (bestDistSq > 450) {
        for (let i = 0; i <= NUM_SAMPLES; i += 2) {
          const p = roadSamples[i].pos;
          const d2 = (carState.pos.x - p.x) ** 2 + (carState.pos.z - p.z) ** 2 + ((carState.pos.y - p.y) * 1.4) ** 2;
          if (d2 < bestDistSq) {
            bestDistSq = d2;
            bestIdx = i;
          }
        }
      }

      carState.nearestSampleIdx = bestIdx;
      const s0 = roadSamples[bestIdx];
      const s1 = roadSamples[Math.min(NUM_SAMPLES, bestIdx + 1)];
      const seg = new THREE.Vector3().subVectors(s1.pos, s0.pos);
      const segLenSq = seg.x * seg.x + seg.z * seg.z || 1;
      const t = THREE.MathUtils.clamp(
        ((carState.pos.x - s0.pos.x) * seg.x + (carState.pos.z - s0.pos.z) * seg.z) / segLenSq,
        0, 1
      );

      const projPos = new THREE.Vector3().lerpVectors(s0.pos, s1.pos, t);
      const smoothTangent = new THREE.Vector3().lerpVectors(s0.flatTangent, s1.flatTangent, t).normalize();
      const smoothRight = new THREE.Vector3(-smoothTangent.z, 0, smoothTangent.x).normalize();

      const dx = carState.pos.x - projPos.x;
      const dz = carState.pos.z - projPos.z;
      carState.lateralOffset = dx * smoothRight.x + dz * smoothRight.z;

      return { projPos, smoothTangent, smoothRight, sample: s0 };
    }

    function updatePhysics(dt) {
      const forwardDir = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
      const rightDir = new THREE.Vector3(Math.cos(carState.heading), 0, -Math.sin(carState.heading));

      const forwardSpeed = carState.vel.dot(forwardDir);
      const lateralSpeed = carState.vel.dot(rightDir);
      const absSpeed = Math.abs(forwardSpeed);

      if ((keys.forward || keys.backward) && !carState.raceFinished) {
        carState.raceStarted = true;
      }
      if (carState.raceStarted && !carState.raceFinished) {
        carState.elapsedTime += dt;
      }

      // 方向盤轉向輸入
      const steerInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
      const speedSteerFactor = THREE.MathUtils.lerp(1.0, 0.52, THREE.MathUtils.clamp(absSpeed / 38.0, 0, 1));
      const targetSteer = steerInput * 0.62 * speedSteerFactor;
      carState.steerAngle = THREE.MathUtils.lerp(carState.steerAngle, targetSteer, Math.min(1, dt * 11.0));

      // 縱向動力、漸進腳煞車與坡度重力
      const curSample = roadSamples[carState.nearestSampleIdx];
      const slopeRad = Math.atan(curSample.slopePct / 100);
      const upDownAlign = forwardDir.dot(curSample.flatTangent);
      const gradeForce = -Math.sin(slopeRad) * 9.8 * upDownAlign;

      let accel = 0;
      if (keys.forward) {
        // 高扭力爬坡與五檔衝刺推力曲線（極速可達 145+ km/h）
        const powerFactor = THREE.MathUtils.clamp(1.28 - absSpeed / 56.0, 0.42, 1.28);
        accel += 24.5 * powerFactor;
      }
      if (keys.backward) {
        if (forwardSpeed > 0.8) {
          // 漸進線性腳煞車
          accel -= 21.0;
        } else {
          // 倒車檔
          accel -= 12.5;
        }
      }

      // 滾動阻力與空氣平方阻力
      const drag = -forwardSpeed * 0.065 - forwardSpeed * absSpeed * 0.0046;
      let nextForwardSpeed = forwardSpeed + (accel + gradeForce + drag) * dt;

      // 手煞車：低縱向衰減＋起甩打滑＋靜止坡道駐煞鎖定
      if (keys.handbrake) {
        if (absSpeed < 0.45 && !keys.forward && !keys.backward) {
          nextForwardSpeed = 0;
        } else {
          nextForwardSpeed *= Math.pow(0.996, dt * 60);
        }
      }

      // 側向抓地力與手煞車起甩打滑（Drift）
      const lateralGrip = keys.handbrake ? 0.72 : 8.2;
      const nextLateralSpeed = lateralSpeed * Math.exp(-lateralGrip * dt);

      // 車頭指向角速度
      if (absSpeed > 0.25 || (keys.handbrake && absSpeed > 0.15)) {
        const revSign = nextForwardSpeed >= -0.05 ? 1 : -1;
        const turnRate = keys.handbrake ? 3.25 : 2.15;
        const lowSpeedBoost = THREE.MathUtils.clamp(absSpeed / 4.5, 0.25, 1.0);
        carState.heading += carState.steerAngle * turnRate * lowSpeedBoost * revSign * dt;
      }

      // 合成世界平面速度向量
      const newForwardDir = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
      const newRightDir = new THREE.Vector3(Math.cos(carState.heading), 0, -Math.sin(carState.heading));
      carState.vel.copy(newForwardDir).multiplyScalar(nextForwardSpeed).addScaledVector(newRightDir, nextLateralSpeed);
      carState.speed = carState.vel.length();

      // 更新車身位置
      carState.pos.x += carState.vel.x * dt;
      carState.pos.z += carState.vel.z * dt;

      // 貼齊路面並處理護欄順向滑行碰撞
      const { projPos, smoothTangent, smoothRight, sample } = projectCarOntoRoad();
      carState.pos.y = projPos.y;

      const maxLateral = ROAD_HALF_WIDTH - 0.92;
      if (Math.abs(carState.lateralOffset) > maxLateral) {
        const wallSide = Math.sign(carState.lateralOffset);
        const penetration = Math.abs(carState.lateralOffset) - maxLateral;
        carState.pos.addScaledVector(smoothRight, -wallSide * penetration);

        // 僅消除垂直撞入牆面的速度分量，保留沿護欄切線的絲滑滑行動能
        const vDotOut = carState.vel.dot(smoothRight) * wallSide;
        if (vDotOut > 0) {
          if (vDotOut > 3.2) {
            cameraShake = Math.min(0.28, vDotOut * 0.025);
          }
          carState.vel.addScaledVector(smoothRight, -wallSide * vDotOut);
          carState.vel.multiplyScalar(0.992);
        }

        // 護欄角度修正：方向盤優先順應修正（幅度極低），方向盤回正時順著目前車頭行進方向微幅轉正
        const moveSign = smoothTangent.dot(newForwardDir) >= 0 ? 1 : -1;
        const wallTargetDir = smoothTangent.clone().multiplyScalar(moveSign);
        const wallHeading = Math.atan2(wallTargetDir.x, wallTargetDir.z);

        let angleDiff = wallHeading - carState.heading;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

        if (Math.abs(steerInput) > 0.05) {
          carState.heading += steerInput * 0.22 * dt;
        } else {
          carState.heading += angleDiff * 0.35 * dt;
        }
      }

      // 甩尾判定與後輪白煙特效
      const slipSpeed = Math.abs(nextLateralSpeed);
      if (slipSpeed > 2.4 && carState.speed > 4.0) {
        carState.driftScore += Math.round(slipSpeed * dt * 28);
        if (Math.random() < 0.75) {
          const rearL = carState.pos.clone().addScaledVector(newForwardDir, -1.35).addScaledVector(newRightDir, -0.85);
          const rearR = carState.pos.clone().addScaledVector(newForwardDir, -1.35).addScaledVector(newRightDir, 0.85);
          spawnDriftSmoke(rearL);
          spawnDriftSmoke(rearR);
        }
      }

      // 更新 3D 車身姿態與四輪動畫
      carGroup.position.copy(carState.pos);
      carGroup.rotation.order = 'YXZ';
      carGroup.rotation.y = carState.heading;
      const targetPitch = -Math.atan(sample.slopePct / 100) * upDownAlign;
      const targetRoll = THREE.MathUtils.clamp(-nextLateralSpeed * 0.016 - carState.steerAngle * 0.04, -0.11, 0.11);
      carState.pitch = THREE.MathUtils.lerp(carState.pitch, targetPitch, Math.min(1, dt * 10));
      carState.roll = THREE.MathUtils.lerp(carState.roll, targetRoll, Math.min(1, dt * 10));
      carGroup.rotation.x = carState.pitch;
      carGroup.rotation.z = carState.roll;

      carState.wheelSpin += (nextForwardSpeed / 0.35) * dt;
      wheelMeshes.forEach(w => {
        w.pivot.rotation.y = w.front ? carState.steerAngle : 0;
        w.mesh.rotation.x = carState.wheelSpin;
      });

      if (brakeLightMat) {
        brakeLightMat.color.setHex((keys.backward || keys.handbrake) ? 0xff2222 : 0x7f1d1d);
      }

      // 地標觸發與完賽判定
      landmarkTriggers.forEach(lt => {
        if (!lt.triggered && carState.nearestSampleIdx >= lt.index) {
          lt.triggered = true;
          showToast(`📍 ${lt.text}`);
        }
      });

      if (!carState.raceFinished && carState.nearestSampleIdx >= NUM_SAMPLES - 8) {
        carState.raceFinished = true;
        document.getElementById('finish-time').textContent = formatTimer(carState.elapsedTime);
        document.getElementById('finish-maxspeed').textContent = `${Math.round(carState.maxSpeedKmh)} km/h`;
        document.getElementById('finish-drift').textContent = String(carState.driftScore);
        document.getElementById('finish-modal').classList.remove('hidden');
        document.getElementById('finish-modal').classList.add('flex');
      }

      // 更新 HUD 數位儀表
      const speedKmh = Math.round(carState.speed * 3.6);
      if (speedKmh > carState.maxSpeedKmh) carState.maxSpeedKmh = speedKmh;

      document.getElementById('hud-speed').textContent = String(speedKmh);
      document.getElementById('mobile-speed').textContent = String(speedKmh);
      document.getElementById('hud-elev').textContent = String(Math.round(sample.realElev));
      const slopeVal = Math.round(sample.slopePct);
      document.getElementById('hud-slope').textContent = `${slopeVal >= 0 ? '+' : ''}${slopeVal}%`;
      document.getElementById('hud-timer').textContent = formatTimer(carState.elapsedTime);
      document.getElementById('hud-drift').textContent = `甩尾: ${carState.driftScore}`;

      // 5 速密齒比檔位顯示
      let gearLabel = 'N';
      if (nextForwardSpeed < -0.5) gearLabel = 'R';
      else if (speedKmh >= 118) gearLabel = '5';
      else if (speedKmh >= 88) gearLabel = '4';
      else if (speedKmh >= 58) gearLabel = '3';
      else if (speedKmh >= 28) gearLabel = '2';
      else if (speedKmh >= 2) gearLabel = '1';
      document.getElementById('hud-gear').textContent = gearLabel;

      // 目前彎道編號
      let currentBend = 0;
      for (let i = 0; i < bendMarkers.length; i++) {
        if (carState.nearestSampleIdx >= bendMarkers[i].sampleIndex - 5) {
          currentBend = bendMarkers[i].bendNum;
        } else {
          break;
        }
      }
      document.getElementById('hud-bend').textContent = currentBend > 0 ? `第 ${currentBend} 彎` : '起點前';

      const pct = THREE.MathUtils.clamp((carState.nearestSampleIdx / NUM_SAMPLES) * 100, 0, 100);
      document.getElementById('hud-progress').style.width = `${pct.toFixed(1)}%`;
      const curKm = ((carState.nearestSampleIdx / NUM_SAMPLES) * (totalTrackLength / 1000)).toFixed(1);
      const totKm = (totalTrackLength / 1000).toFixed(1);
      document.getElementById('hud-dist').textContent = `${curKm} / ${totKm} km`;
    }

    function updateCameraAndEffects(dt) {
      const forwardDir = new THREE.Vector3(Math.sin(carState.heading), 0, Math.cos(carState.heading));
      const speedKmh = carState.speed * 3.6;

      // 動態視野（Dynamic FOV）增強速度感
      const targetFov = 62 + THREE.MathUtils.clamp(speedKmh / 145, 0, 1) * 14;
      camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, Math.min(1, dt * 6));
      camera.updateProjectionMatrix();

      if (cameraMode === 0) {
        const camTarget = carState.pos.clone()
          .addScaledVector(forwardDir, -6.6)
          .add(new THREE.Vector3(0, 2.55, 0));
        camera.position.lerp(camTarget, Math.min(1, dt * 9.5));
        const lookAtPt = carState.pos.clone().addScaledVector(forwardDir, 10.0).add(new THREE.Vector3(0, 1.35, 0));
        camera.lookAt(lookAtPt);
      } else if (cameraMode === 1) {
        const hoodPos = carState.pos.clone()
          .addScaledVector(forwardDir, 0.85)
          .add(new THREE.Vector3(0, 1.35, 0));
        camera.position.copy(hoodPos);
        const lookAtPt = carState.pos.clone().addScaledVector(forwardDir, 22.0).add(new THREE.Vector3(0, 1.2, 0));
        camera.lookAt(lookAtPt);
      } else {
        const farTarget = carState.pos.clone()
          .addScaledVector(forwardDir, -14.5)
          .add(new THREE.Vector3(0, 8.2, 0));
        camera.position.lerp(farTarget, Math.min(1, dt * 7.5));
        const lookAtPt = carState.pos.clone().addScaledVector(forwardDir, 8.0);
        camera.lookAt(lookAtPt);
      }

      if (cameraShake > 0.001) {
        camera.position.x += (Math.random() - 0.5) * cameraShake;
        camera.position.y += (Math.random() - 0.5) * cameraShake;
        cameraShake *= Math.exp(-12 * dt);
      }

      // 太陽光陰影視錐跟隨車輛移動
      dirLight.position.set(carState.pos.x + 320, carState.pos.y + 620, carState.pos.z + 240);
      dirLight.target.position.copy(carState.pos);
      dirLight.target.updateMatrixWorld();

      // 更新白煙粒子
      for (let i = 0; i < SMOKE_COUNT; i++) {
        const p = smokeParticles[i];
        if (!p.mesh.visible) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.mesh.visible = false;
        } else {
          p.mesh.position.addScaledVector(p.vel, dt);
          const ratio = 1 - p.life / p.maxLife;
          p.mesh.scale.setScalar(0.5 + ratio * 1.9);
          p.mesh.material.opacity = (1 - ratio) * 0.42;
        }
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 10. 啟動遊戲主迴圈
    // =========================================================================
    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      updatePhysics(dt);
      updateCameraAndEffects(dt);
      renderMinimap(carState.pos, carState.heading);
      renderer.render(scene, camera);
    }

    let gameBooted = false;
    function bootGame() {
      if (gameBooted) return;
      gameBooted = true;
      resetToStart();
      lastFrameTime = performance.now();
      requestAnimationFrame(animate);
    }

    if (document.readyState === 'complete') {
      bootGame();
    } else {
      window.addEventListener('load', bootGame);
    }
  </script>
</body>
</html>
