<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梅山三十六彎 · 縣道162甲  賽車</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
    }
    .touch-btn {
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      transition: transform 0.08s ease, background-color 0.08s ease;
    }
    .touch-btn:active, .touch-btn.active {
      transform: scale(0.93);
      background: rgba(239, 68, 68, 0.55);
      border-color: rgba(252, 165, 165, 0.8);
    }
  </style>
</head>
<body>
  <!-- 3D 渲染畫布 -->
  <canvas id="game-canvas"></canvas>

  <!-- 頂部 HUD：賽事資訊、彎道計數、時間與小地圖 -->
  <div class="fixed top-3 left-3 right-3 z-20 flex items-start justify-between pointer-events-none gap-2">
    <!-- 左上：路線名稱與進度 -->
    <div class="glass-panel rounded-2xl px-4 py-3 text-white pointer-events-auto max-w-[62%] sm:max-w-sm">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-black rounded-md bg-red-600 text-white tracking-wider">162甲</span>
        <h1 class="text-sm sm:text-base font-black tracking-wide truncate">梅山三十六彎 · 太平雲梯</h1>
      </div>
      <div class="mt-2 grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900/60 rounded-xl px-2 py-1.5">
          <div class="text-[10px] text-slate-400 font-semibold">目前彎道</div>
          <div id="hud-bend" class="text-sm sm:text-base font-black text-amber-400">起點前</div>
        </div>
        <div class="bg-slate-900/60 rounded-xl px-2 py-1.5">
          <div class="text-[10px] text-slate-400 font-semibold">海拔 / 坡度</div>
          <div class="text-xs sm:text-sm font-bold text-emerald-300">
            <span id="hud-elev">302</span>m <span id="hud-slope" class="text-[11px] text-slate-300">+0%</span>
          </div>
        </div>
        <div class="bg-slate-900/60 rounded-xl px-2 py-1.5">
          <div class="text-[10px] text-slate-400 font-semibold">計時</div>
          <div id="hud-timer" class="text-xs sm:text-sm font-mono font-bold text-sky-300">00:00.0</div>
        </div>
      </div>
      <!-- 路線進度條（支援點擊／拖曳直接傳送至指定路段） -->
      <div class="mt-2.5">
        <div class="flex justify-between text-[10px] text-slate-300 mb-1">
          <span>西門大將軍</span>
          <span id="hud-dist">0.0 / 9.5 km</span>
          <span>太平雲梯</span>
        </div>
        <div id="hud-progress-track" title="點擊或拖曳進度條直接傳送至該路段" class="w-full py-1.5 -my-1.5 cursor-pointer group">
          <div class="w-full h-2 group-hover:h-2.5 bg-slate-800 rounded-full overflow-hidden transition-all ring-0 group-hover:ring-2 group-hover:ring-amber-400/50">
            <div id="hud-progress" class="h-full bg-gradient-to-r from-emerald-400 via-amber-400 to-red-500 rounded-full transition-all duration-75" style="width: 0%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右上：含 10m 等高線的 162 甲線小地圖 -->
    <div class="glass-panel rounded-2xl p-2 pointer-events-auto flex flex-col items-center">
      <canvas id="minimap-canvas" width="336" height="256" style="width: 168px; height: 128px;" class="rounded-xl bg-slate-950/85 block"></canvas>
      <div class="w-full flex justify-between items-center px-1 pt-1 text-[10px] text-slate-300">
        <span>10m 等高線圖</span>
        <span id="hud-drift" class="text-amber-400 font-bold">甩尾: 0</span>
      </div>
    </div>
  </div>

  <!-- 中央上方：地標與操作即時提示橫幅 -->
  <div id="toast-banner" class="fixed top-36 sm:top-28 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2">
    <div class="glass-panel rounded-full px-5 py-2 text-xs sm:text-sm font-bold text-amber-200 border border-amber-400/40 whitespace-nowrap shadow-xl">
      <span id="toast-text">📍 梅山三十六彎起點</span>
    </div>
  </div>

  <!-- 左下：功能快捷鍵列（桌面與平板） -->
  <div class="fixed bottom-4 left-4 z-20 hidden md:flex flex-wrap items-center gap-2">
    <button id="btn-camera" class="glass-panel hover:bg-slate-800/90 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-pointer transition">
      🎥 視角 (C)
    </button>
    <button id="btn-fog" class="glass-panel hover:bg-slate-800/90 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-pointer transition">
      🌫️ 山嵐霧氣 (F)
    </button>
    <button id="btn-recover" class="glass-panel hover:bg-slate-800/90 text-amber-300 text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-pointer transition">
      🔄 原地回正 (R)
    </button>
    <button id="btn-home" class="glass-panel hover:bg-red-900/80 text-rose-200 border-rose-400/30 text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-pointer transition">
      🏁 回到初始點 (H)
    </button>
  </div>

  <!-- 右下：數位時速表與檔位 -->
  <div class="fixed bottom-4 right-4 z-20 hidden md:flex items-center gap-3 glass-panel rounded-2xl px-5 py-3 text-white">
    <div class="text-right">
      <div class="text-[10px] text-slate-400 font-semibold tracking-wider">SPEED</div>
      <div class="flex items-baseline gap-1">
        <span id="hud-speed" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
        <span class="text-xs font-bold text-slate-400">km/h</span>
      </div>
    </div>
    <div class="h-10 w-[1px] bg-slate-700"></div>
    <div class="flex flex-col items-center">
      <span class="text-[10px] text-slate-400 font-semibold">GEAR</span>
      <span id="hud-gear" class="text-xl font-black text-amber-400">N</span>
    </div>
  </div>

  <!-- 手機／觸控操作介面 -->
  <div class="fixed bottom-3 left-3 right-3 z-20 flex md:hidden items-end justify-between pointer-events-none">
    <!-- 左手轉向 -->
    <div class="flex gap-2 pointer-events-auto">
      <button id="touch-left" class="touch-btn w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl font-black">◀</button>
      <button id="touch-right" class="touch-btn w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl font-black">▶</button>
    </div>

    <!-- 中間迷你時速與快捷鈕 -->
    <div class="flex flex-col items-center gap-1.5 pointer-events-auto">
      <div class="flex gap-1.5">
        <button id="touch-cam" class="touch-btn px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-white">視角</button>
        <button id="touch-recover" class="touch-btn px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-amber-300">回正</button>
        <button id="touch-home" class="touch-btn px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-rose-300">起點</button>
      </div>
      <div class="glass-panel rounded-xl px-3 py-1 text-center text-white">
        <span id="mobile-speed" class="text-lg font-black font-mono">0</span>
        <span class="text-[10px] text-slate-300">km/h</span>
      </div>
    </div>

    <!-- 右手油門／煞車／手煞車 -->
    <div class="flex items-end gap-2 pointer-events-auto">
      <button id="touch-handbrake" class="touch-btn w-12 h-12 rounded-2xl flex items-center justify-center text-amber-300 text-xs font-black">手煞</button>
      <button id="touch-brake" class="touch-btn w-13 h-14 px-3 rounded-2xl flex items-center justify-center text-rose-300 text-xs font-black">倒退</button>
      <button id="touch-gas" class="touch-btn w-14 h-16 rounded-2xl flex items-center justify-center text-emerald-300 text-sm font-black">油門</button>
    </div>
  </div>

  <!-- 完賽結算彈窗 -->
  <div id="finish-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/75 backdrop-blur-md p-4">
    <div class="glass-panel rounded-3xl max-w-md w-full p-6 text-center text-white border border-amber-400/40">
      <div class="inline-block px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-black mb-2">🏁 攻頂成功 · 海拔 931 公尺</div>
      <h2 class="text-2xl font-black tracking-wide">梅山三十六彎制霸！</h2>
      <p class="text-xs text-slate-300 mt-1">嘉義縣道 162 甲線 · 西門大將軍 ➔ 太平雲梯</p>
      <div class="grid grid-cols-3 gap-3 my-5">
        <div class="bg-slate-900/75 rounded-2xl p-3">
          <div class="text-[11px] text-slate-400">完賽時間</div>
          <div id="finish-time" class="text-base font-black font-mono text-sky-300 mt-0.5">00:00.0</div>
        </div>
        <div class="bg-slate-900/75 rounded-2xl p-3">
          <div class="text-[11px] text-slate-400">最高時速</div>
          <div id="finish-maxspeed" class="text-base font-black font-mono text-emerald-300 mt-0.5">0 km/h</div>
        </div>
        <div class="bg-slate-900/75 rounded-2xl p-3">
          <div class="text-[11px] text-slate-400">甩尾積分</div>
          <div id="finish-drift" class="text-base font-black font-mono text-amber-400 mt-0.5">0</div>
        </div>
      </div>
      <div class="flex gap-3">
        <button id="btn-replay" class="flex-1 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black py-3 rounded-xl cursor-pointer transition shadow-lg">
          回到初始點再跑一趟
        </button>
        <button id="btn-keep-driving" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl cursor-pointer transition">
          繼續自由駕駛
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. Three.js 基礎場景、攝影機、渲染器與山林光影初始化
    // =========================================================================
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;

    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0x9ec5d8);
    scene.background = skyColor;

    // 梅山午後山嵐霧氣等級（清朗 / 薄霧 / 濃霧）
    const fogLevels = [
      { density: 0.00055, label: '清朗視野', color: 0x9ec5d8 },
      { density: 0.00145, label: '薄霧山嵐', color: 0xb7ced9 },
      { density: 0.00290, label: '濃厚雲霧', color: 0xcbd5e1 }
    ];
    let currentFogIdx = 0;
    scene.fog = new THREE.FogExp2(fogLevels[0].color, fogLevels[0].density);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.4, 3400);

    // 環境半球光與太陽光
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x365314, 0.85);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.25);
    dirLight.position.set(420, 880, 310);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 50;
    dirLight.shadow.camera.far = 2600;
    const shadowBound = 650;
    dirLight.shadow.camera.left = -shadowBound;
    dirLight.shadow.camera.right = shadowBound;
    dirLight.shadow.camera.top = shadowBound;
    dirLight.shadow.camera.bottom = -shadowBound;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);
    scene.add(dirLight.target);

    // 過濾極近重複點並進行兩輪高程氣壓計階梯平滑濾波
    const cleanedGpx = [];
    rawGpxTrackpoints.forEach((pt, i) => {
      if (i === 0) {
        cleanedGpx.push({ ...pt });
      } else {
        const prev = cleanedGpx[cleanedGpx.length - 1];
        const d = Math.hypot(pt.lat - prev.lat, pt.lon - prev.lon);
        if (d > 0.000015 || i === rawGpxTrackpoints.length - 1) {

        }
      }
    });

    for (let pass = 0; pass < 2; pass++) {
      const prevEles = cleanedGpx.map(p => p.ele);
      for (let i = 1; i < cleanedGpx.length - 1; i++) {
        cleanedGpx[i].ele = prevEles[i - 1] * 0.25 + prevEles[i] * 0.5 + prevEles[i + 1] * 0.25;
      }
    }

    // 嘉義梅山當地緯度（23.56°N）1:1 真實地球公尺投影轉換
    const REF_LAT = 23.5625;
    const REF_LON = 120.5850;
    const BASE_ELEV = 300.0;
    const METERS_PER_DEG_LAT = 110750.0;
    const METERS_PER_DEG_LON = 111320.0 * Math.cos(REF_LAT * Math.PI / 180.0);

    function gpsToWorld(lat, lon, ele) {
      const x = (lon - REF_LON) * METERS_PER_DEG_LON;
      const z = -(lat - REF_LAT) * METERS_PER_DEG_LAT;
      const y = ele - BASE_ELEV;
      return new THREE.Vector3(x, y, z);
    }

    function worldToGps(x, z) {
      const lon = REF_LON + x / METERS_PER_DEG_LON;
      const lat = REF_LAT - z / METERS_PER_DEG_LAT;
      return { lat, lon };
    }

    const curveControlPts = cleanedGpx.map(p => gpsToWorld(p.lat, p.lon, p.ele));
    const trackCurve = new THREE.CatmullRomCurve3(curveControlPts, false, 'centripetal', 0.35);
    const totalTrackLength = trackCurve.getLength();
    const NUM_SAMPLES = 2800;
    const spacedPts = trackCurve.getSpacedPoints(NUM_SAMPLES);

    const roadSamples = [];
    for (let i = 0; i <= NUM_SAMPLES; i++) {
      const p = spacedPts[i];
      const pPrev = spacedPts[Math.max(0, i - 1)];
      const pNext = spacedPts[Math.min(NUM_SAMPLES, i + 1)];
      const tangent = new THREE.Vector3().subVectors(pNext, pPrev).normalize();
      const flatTangent = new THREE.Vector3(tangent.x, 0, tangent.z).normalize();
      const right = new THREE.Vector3(-flatTangent.z, 0, flatTangent.x).normalize();

        pos: p.clone(),
        tangent,
        flatTangent,
        right,
        realElev: p.y + BASE_ELEV,
        slopePct,
        curvature: 0
      });
    }

    // 計算每個採樣點的局部曲率（供急彎內側護欄移除與反光鏡擺設使用）
    for (let i = 0; i <= NUM_SAMPLES; i++) {
      const i0 = Math.max(0, i - 6);
      const i1 = Math.min(NUM_SAMPLES, i + 6);
      const t0 = roadSamples[i0].flatTangent;
      const t1 = roadSamples[i1].flatTangent;
      const dot = THREE.MathUtils.clamp(t0.dot(t1), -1, 1);
      roadSamples[i].curvature = Math.acos(dot);
    }

    // =========================================================================
    // 3. 1～36 彎實測座標循序道路中心線與彎心（Apex）自動校正
    // =========================================================================
    const raw36BendCoords = [
      { bend: 1,  lat: 23.565930, lon: 120.573435, note: '' },
      { bend: 2,  lat: 23.566773, lon: 120.573466, note: '西門大將軍' },
      { bend: 3,  lat: 23.564209, lon: 120.575661, note: '半天寮橋' },
      { bend: 4,  lat: 23.563146, lon: 120.576181, note: '' },
      { bend: 5,  lat: 23.561782, lon: 120.572736, note: '' },
      { bend: 6,  lat: 23.559999, lon: 120.581396, note: '' },
      { bend: 7,  lat: 23.560583, lon: 120.581631, note: '' },
      { bend: 8,  lat: 23.559590, lon: 120.581872, note: '' },
      { bend: 9,  lat: 23.560140, lon: 120.582524, note: '' },
      { bend: 10, lat: 23.559634, lon: 120.582824, note: '' },
      { bend: 11, lat: 23.559969, lon: 120.584158, note: '樂活農莊' },
      { bend: 12, lat: 23.559368, lon: 120.583327, note: '梅山夜景' },
      { bend: 13, lat: 23.559955, lon: 120.584919, note: '' },
      { bend: 14, lat: 23.559093, lon: 120.584072, note: '' },
      { bend: 15, lat: 23.559656, lon: 120.586006, note: '' },
      { bend: 16, lat: 23.557025, lon: 120.585896, note: '' },
      { bend: 17, lat: 23.558250, lon: 120.585366, note: '' },
      { bend: 18, lat: 23.560245, lon: 120.587173, note: '' },
      { bend: 19, lat: 23.563990, lon: 120.589967, note: '' },
      { bend: 20, lat: 23.564012, lon: 120.590684, note: '' },
      { bend: 21, lat: 23.563761, lon: 120.590176, note: '' },
      { bend: 22, lat: 23.564492, lon: 120.592242, note: '阿里山國家風景區牌坊' },
      { bend: 23, lat: 23.562707, lon: 120.589923, note: '' },
      { bend: 24, lat: 23.563610, lon: 120.592408, note: '阿嬤咖啡彎道' },
      { bend: 25, lat: 23.562481, lon: 120.591639, note: '' },
      { bend: 26, lat: 23.562049, lon: 120.591008, note: '' },
      { bend: 27, lat: 23.562956, lon: 120.593424, note: '' },
      { bend: 28, lat: 23.561307, lon: 120.591903, note: '梅山觀景臺' },
      { bend: 29, lat: 23.561420, lon: 120.594145, note: '大坪登山古道入口' },
      { bend: 30, lat: 23.562910, lon: 120.594729, note: '' },
      { bend: 31, lat: 23.561414, lon: 120.596319, note: '' },
      { bend: 32, lat: 23.562481, lon: 120.595168, note: '' },
      { bend: 33, lat: 23.561872, lon: 120.596673, note: '' },
      { bend: 34, lat: 23.562717, lon: 120.595554, note: '' },
      { bend: 35, lat: 23.562341, lon: 120.596239, note: '' },
      { bend: 36, lat: 23.563038, lon: 120.595817, note: '太平三十六彎' }
    ];

    const extraGeoLandmarks = [
      { lat: 23.55918, lon: 120.57983, text: '南門大將軍廟（海拔 441m）' },
      { lat: 23.55982, lon: 120.59798, text: '太平三十六彎終點 · 太平雲梯入口（海拔 931m）' }
    ];

    const bendMarkers = [];
    function computeAdjusted36Bends() {
      let minSearchIdx = 12;
      raw36BendCoords.forEach(item => {
        const targetWp = gpsToWorld(item.lat, item.lon, BASE_ELEV);
        const maxSearchIdx = Math.min(NUM_SAMPLES - 6, minSearchIdx + 560);

        let closestIdx = minSearchIdx;
        let closestDistSq = Infinity;
        for (let i = minSearchIdx; i <= maxSearchIdx; i++) {
          const dx = roadSamples[i].pos.x - targetWp.x;
          const dz = roadSamples[i].pos.z - targetWp.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < closestDistSq) {
            closestDistSq = d2;
            closestIdx = i;
          }
        }

        // 在最近道路點前後 ±8 個採樣點內尋找局部最大曲率彎心
        let bestApexIdx = closestIdx;
        let bestScore = -Infinity;
        const winStart = Math.max(minSearchIdx, closestIdx - 8);
        const winEnd = Math.min(NUM_SAMPLES - 6, closestIdx + 8);
        for (let k = winStart; k <= winEnd; k++) {
          const score = roadSamples[k].curvature - Math.abs(k - closestIdx) * 0.0012;
          if (score > bestScore) {
            bestScore = score;
            bestApexIdx = k;
          }
        }

        const snappedSample = roadSamples[bestApexIdx];
        const snappedGps = worldToGps(snappedSample.pos.x, snappedSample.pos.z);

        bendMarkers.push({
          bendNum: item.bend,
          sampleIndex: bestApexIdx,
          note: item.note,
          lat: snappedGps.lat,
          lon: snappedGps.lon,
          ele: snappedSample.realElev
        });

        minSearchIdx = bestApexIdx + 5;
      });
    }

    computeAdjusted36Bends();

    const landmarkTriggers = [];
    bendMarkers.forEach(bm => {
      if (bm.note) {
        landmarkTriggers.push({
          index: bm.sampleIndex,
          text: `第 ${bm.bendNum} 彎 · ${bm.note}（海拔 ${Math.round(bm.ele)}m）`,
          triggered: false
        });
      }
    });
    extraGeoLandmarks.forEach(item => {
      const wp = gpsToWorld(item.lat, item.lon, BASE_ELEV);
      let bestIdx = 0;
      let bestD = Infinity;
      for (let i = 0; i <= NUM_SAMPLES; i++) {
        const dx = roadSamples[i].pos.x - wp.x;
        const dz = roadSamples[i].pos.z - wp.z;
        const d = dx * dx + dz * dz;
        if (d < bestD) {
          bestD = d;
          bestIdx = i;
        }
      }
      landmarkTriggers.push({ index: bestIdx, text: item.text, triggered: false });
    });
    landmarkTriggers.sort((a, b) => a.index - b.index);

    // =========================================================================
    // 4. 柏油路面（全線雙黃實線）、路基擋土牆與單側護欄（髮夾彎僅移除內側）
    // =========================================================================
    const ROAD_HALF_WIDTH = 5.4;

    function createAsphaltTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 柏油底色與細膩砂石顆粒
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 16000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const v = 42 + Math.floor(Math.random() * 34);
        ctx.fillStyle = `rgb(${v},${v + 5},${v + 12})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // 兩側路緣白線
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(18, 0, 8, 512);
      ctx.fillRect(486, 0, 8, 512);

      // 全線中央連續雙黃實線
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(247, 0, 6, 512);
      ctx.fillRect(259, 0, 6, 512);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      return tex;
    }

    function buildRoadAndGuardrails() {
      const roadPositions = [];
      const roadUVs = [];
      const roadIndices = [];

      const basePositions = [];
      const baseIndices = [];

      let accDist = 0;
      for (let i = 0; i <= NUM_SAMPLES; i++) {
        const s = roadSamples[i];
        if (i > 0) {
          accDist += s.pos.distanceTo(roadSamples[i - 1].pos);
        }
        const leftPt = s.pos.clone().addScaledVector(s.right, -ROAD_HALF_WIDTH);
        const rightPt = s.pos.clone().addScaledVector(s.right, ROAD_HALF_WIDTH);

        roadPositions.push(leftPt.x, leftPt.y + 0.04, leftPt.z);
        roadPositions.push(rightPt.x, rightPt.y + 0.04, rightPt.z);
        roadUVs.push(0, accDist * 0.08);
        roadUVs.push(1, accDist * 0.08);

        // 路基擋土牆頂點（往下延伸 18m 嵌入山坡，杜絕懸空感）
        const leftOuter = s.pos.clone().addScaledVector(s.right, -(ROAD_HALF_WIDTH + 0.65));
        const rightOuter = s.pos.clone().addScaledVector(s.right, ROAD_HALF_WIDTH + 0.65);
        basePositions.push(leftOuter.x, leftOuter.y - 0.05, leftOuter.z);
        basePositions.push(leftOuter.x, leftOuter.y - 18.0, leftOuter.z);
        basePositions.push(rightOuter.x, rightOuter.y - 0.05, rightOuter.z);
        basePositions.push(rightOuter.x, rightOuter.y - 18.0, rightOuter.z);

        if (i < NUM_SAMPLES) {
          const v = i * 2;
          roadIndices.push(v, v + 1, v + 2);
          roadIndices.push(v + 1, v + 3, v + 2);

          const b = i * 4;
          baseIndices.push(b, b + 4, b + 1);
          baseIndices.push(b + 1, b + 4, b + 5);
          baseIndices.push(b + 2, b + 3, b + 6);
          baseIndices.push(b + 3, b + 7, b + 6);
        }
      }

      const roadGeo = new THREE.BufferGeometry();
      roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
      roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUVs, 2));
      roadGeo.setIndex(roadIndices);
      roadGeo.computeVertexNormals();

      const roadMat = new THREE.MeshStandardMaterial({
        map: createAsphaltTexture(),
        roughness: 0.85,
        metalness: 0.06,
        side: THREE.DoubleSide
      });
      const roadMesh = new THREE.Mesh(roadGeo, roadMat);
      roadMesh.receiveShadow = true;
      scene.add(roadMesh);

      const baseGeo = new THREE.BufferGeometry();
      baseGeo.setAttribute('position', new THREE.Float32BufferAttribute(basePositions, 3));
      baseGeo.setIndex(baseIndices);
      baseGeo.computeVertexNormals();
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x475569,
        roughness: 0.92,
        side: THREE.DoubleSide
      });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      scene.add(baseMesh);

      // 建立護欄：急彎處僅移除「內側」護欄，保留「外側」懸崖護欄
      const railMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        metalness: 0.35,
        roughness: 0.45,
        side: THREE.DoubleSide
      });
      const postMat = new THREE.MeshStandardMaterial({
        color: 0x64748b,
        metalness: 0.5,
        roughness: 0.5
      });

      [-1, 1].forEach(side => {
        let segPositions = [];
        let segIndices = [];
        const flushSegment = () => {
          if (segPositions.length >= 12) {
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(segPositions, 3));
            g.setIndex(segIndices);
            g.computeVertexNormals();
            const m = new THREE.Mesh(g, railMat);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
          }
          segPositions = [];
          segIndices = [];
        };

        for (let i = 0; i <= NUM_SAMPLES; i++) {
          const s = roadSamples[i];
          const prevT = roadSamples[Math.max(0, i - 4)].flatTangent;
          const nextT = roadSamples[Math.min(NUM_SAMPLES, i + 4)].flatTangent;
          const crossY = prevT.x * nextT.z - prevT.z * nextT.x;
          const isInnerHairpin = (s.curvature > 0.38) && ((crossY > 0 && side === 1) || (crossY < 0 && side === -1));

          const railPt = s.pos.clone().addScaledVector(s.right, side * (ROAD_HALF_WIDTH + 0.15));

          let encroachesOtherRoad = false;
          for (let j = 0; j <= NUM_SAMPLES; j += 4) {
            if (Math.abs(i - j) < 35) continue;
            const other = roadSamples[j].pos;
            if (Math.abs(other.y - railPt.y) < 5.5) {
              const dist = Math.hypot(other.x - railPt.x, other.z - railPt.z);
              if (dist < ROAD_HALF_WIDTH + 1.2) {
                encroachesOtherRoad = true;
                break;
              }
            }
          }

          if (isInnerHairpin || encroachesOtherRoad) {
            flushSegment();
            continue;
          }

          const baseIdx = segPositions.length / 3;
          segPositions.push(railPt.x, railPt.y + 0.42, railPt.z);
          segPositions.push(railPt.x, railPt.y + 0.78, railPt.z);

          if (baseIdx >= 2) {
            segIndices.push(baseIdx - 2, baseIdx - 1, baseIdx);
            segIndices.push(baseIdx - 1, baseIdx + 1, baseIdx);
          }

          if (i % 5 === 0) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.82, 6), postMat);
            post.position.set(railPt.x, railPt.y + 0.38, railPt.z);
            scene.add(post);
          }
        }
        flushSegment();
      });
    }

    buildRoadAndGuardrails();

    // =========================================================================
    // 5. 全區 3D 山脈與溪谷地形（無 3D 等高線、確保絕不穿模路面）
    // =========================================================================
    const GRID_CELL = 36;
    const roadSpatialGrid = new Map();
    for (let i = 0; i <= NUM_SAMPLES; i++) {
      const p = roadSamples[i].pos;
      const gx = Math.floor(p.x / GRID_CELL);
      const gz = Math.floor(p.z / GRID_CELL);
      const key = `${gx},${gz}`;
      if (!roadSpatialGrid.has(key)) roadSpatialGrid.set(key, []);
      roadSpatialGrid.get(key).push(p);
    }

    // 九芎坑溪谷路徑
    const creekPts = [
      gpsToWorld(23.5682, 120.5695, 275),
      gpsToWorld(23.5653, 120.5735, 310),
      gpsToWorld(23.5648, 120.5775, 345),
      gpsToWorld(23.5655, 120.5830, 415),
      gpsToWorld(23.5665, 120.5885, 510)
    ];
    const creekCurve = new THREE.CatmullRomCurve3(creekPts);
    const creekSamples = creekCurve.getSpacedPoints(120);

    // 預先計算終點「太平雲梯」左右橋塔錨點，讓 3D 山脈地形與吊橋精準貼合
    const taipingViewSample = roadSamples[Math.max(0, NUM_SAMPLES - 36)];
    const taipingEndSample = roadSamples[NUM_SAMPLES - 6];
    const taipingLeftAnchor = taipingViewSample.pos.clone()
      .addScaledVector(taipingViewSample.flatTangent, 34.0)
      .addScaledVector(taipingViewSample.right, -46.0)
      .add(new THREE.Vector3(0, 34.0, 0));
    const taipingRightAnchor = taipingEndSample.pos.clone()
      .addScaledVector(taipingEndSample.flatTangent, 48.0)
      .addScaledVector(taipingEndSample.right, 68.0)
      .add(new THREE.Vector3(0, 12.0, 0));

    // 第 36 彎（雲海大飯店）實測 GPS 地形錨點：緊鄰轉過第 36 彎後的北側岩壁正上方
    const bm36Ref = bendMarkers[35];
    const idx36Ref = bm36Ref ? bm36Ref.sampleIndex : NUM_SAMPLES - 120;
    const s36ApexSample = roadSamples[idx36Ref];
    const s36PrevT = roadSamples[Math.max(0, idx36Ref - 6)].flatTangent;
    const s36NextT = roadSamples[Math.min(NUM_SAMPLES, idx36Ref + 6)].flatTangent;
    const s36OuterSide = (s36PrevT.x * s36NextT.z - s36PrevT.z * s36NextT.x) > 0 ? -1 : 1;

    // 雲海大飯店主樓與長棟在真實地圖上的精準世界座標（緊貼第 36 彎彎心出彎後左前方岩壁上方）
    const yunhaiFrontPos = gpsToWorld(23.56317, 120.59614, BASE_ELEV);
    const yunhaiWingEndPos = gpsToWorld(23.56304, 120.59656, BASE_ELEV);
    const yunhaiRidgeMidY = s36ApexSample.pos.y + 10.2;

    const s36EntryRef = roadSamples[Math.max(0, idx36Ref - 8)];
    const yunhaiDropCenter = s36EntryRef.pos.clone()
      .addScaledVector(s36EntryRef.flatTangent, -2.0)
      .addScaledVector(s36EntryRef.right, s36OuterSide * 38.0);

    function getTerrainHeightAt(x, z) {
      const gx = Math.floor(x / GRID_CELL);
      const gz = Math.floor(z / GRID_CELL);

      let weightedSum = 0;
      let weightTotal = 0;
      let minRoadClearanceY = Infinity;

      for (let dx = -3; dx <= 3; dx++) {
        for (let dz = -3; dz <= 3; dz++) {
          const bucket = roadSpatialGrid.get(`${gx + dx},${gz + dz}`);
          if (!bucket) continue;
          for (let k = 0; k < bucket.length; k += 2) {
            const rp = bucket[k];
            const distSq = (x - rp.x) * (x - rp.x) + (z - rp.z) * (z - rp.z);
            const dist = Math.sqrt(distSq);

            // 路面安全包絡：確保 3D 山坡絕不穿進柏油路面
            if (dist < 14.5) {
              const trench = dist < 6.4 ? 0.55 : 0.55 + (dist - 6.4) * 0.22;
              minRoadClearanceY = Math.min(minRoadClearanceY, rp.y - trench);
            }

            if (dist < 120.0) {
              const w = 1.0 / (distSq + 65.0);
              weightedSum += (rp.y - 2.2) * w;
              weightTotal += w;
            }
          }
        }
      }

      // 大尺度梅山區域山勢（由西北向東南緩升至海拔 931m+）
      const eastFactor = THREE.MathUtils.clamp((x + 1250) / 2600, 0, 1);
      const southFactor = THREE.MathUtils.clamp((z + 550) / 1150, 0, 1);
      let macroH = 12 + Math.pow(eastFactor, 1.25) * 610 + southFactor * 42;
      macroH += Math.sin(x * 0.0042) * 26 + Math.cos(z * 0.0048) * 22 + Math.sin((x + z) * 0.0085) * 11;

      let finalH = macroH;
      if (weightTotal > 0) {
        const roadGuidedH = weightedSum / weightTotal;
        const blend = THREE.MathUtils.clamp(weightTotal * 420.0, 0, 0.94);
        finalH = THREE.MathUtils.lerp(macroH, roadGuidedH, blend);
      }

      // 九芎坑溪河谷下切
      for (let c = 0; c < creekSamples.length; c += 2) {
        const cp = creekSamples[c];
        const cd = Math.hypot(x - cp.x, z - cp.z);
        if (cd < 38.0) {
          const riverFactor = 1.0 - THREE.MathUtils.smoothstep(cd, 6.0, 38.0);
          finalH = THREE.MathUtils.lerp(finalH, cp.y - 4.5, riverFactor * 0.85);
        }
      }

      // 終點「太平雲梯」專屬地形塑形：左側高山脊托住西橋塔、橋下深切山谷、右側隆起對岸山頭
      const dLeftTower = Math.hypot(x - taipingLeftAnchor.x, z - taipingLeftAnchor.z);
      if (dLeftTower < 115.0) {
        const leftPeakFactor = 1.0 - THREE.MathUtils.smoothstep(dLeftTower, 14.0, 115.0);
        const targetLeftY = taipingLeftAnchor.y - 1.2 + Math.sin(x * 0.04 + z * 0.03) * 2.2;
        finalH = THREE.MathUtils.lerp(finalH, Math.max(finalH, targetLeftY), leftPeakFactor * 0.94);
      }

      // 雲梯下方深切山谷
      const spanDx = taipingRightAnchor.x - taipingLeftAnchor.x;
      const spanDz = taipingRightAnchor.z - taipingLeftAnchor.z;
      const spanLenSq = spanDx * spanDx + spanDz * spanDz || 1;
      const projT = THREE.MathUtils.clamp(((x - taipingLeftAnchor.x) * spanDx + (z - taipingLeftAnchor.z) * spanDz) / spanLenSq, 0, 1);
      const closestBridgeX = taipingLeftAnchor.x + spanDx * projT;
      const closestBridgeZ = taipingLeftAnchor.z + spanDz * projT;
      const distToBridgeLine = Math.hypot(x - closestBridgeX, z - closestBridgeZ);
      if (projT > 0.14 && projT < 0.86 && distToBridgeLine < 130.0) {
        const midSpanEnvelope = Math.sin(((projT - 0.14) / 0.72) * Math.PI);
        const radialEnvelope = 1.0 - THREE.MathUtils.smoothstep(distToBridgeLine, 12.0, 130.0);
        const gorgeDepth = 58.0 * midSpanEnvelope * radialEnvelope;
        finalH -= gorgeDepth;
      }

      // 右側對岸山頭隆起，讓雲梯東端引道自然銜接進山坡稜線
      const dRightPeak = Math.hypot(x - (taipingRightAnchor.x + 12.0), z - (taipingRightAnchor.z + 8.0));
      if (dRightPeak < 120.0) {
        const rightPeakFactor = 1.0 - THREE.MathUtils.smoothstep(dRightPeak, 16.0, 120.0);
        const targetRightY = taipingRightAnchor.y + 4.5 + Math.cos(x * 0.035 - z * 0.03) * 2.8;
        finalH = THREE.MathUtils.lerp(finalH, Math.max(finalH, targetRightY), rightPeakFactor * 0.92);
      }

      // 第 36 彎（雲海大飯店）山脊高台：直接托住實測座標上的雲海大飯店主樓與長棟
      const rDx = yunhaiWingEndPos.x - yunhaiFrontPos.x;
      const rDz = yunhaiWingEndPos.z - yunhaiFrontPos.z;
      const rLenSq = rDx * rDx + rDz * rDz || 1;
      const rT = THREE.MathUtils.clamp(((x - yunhaiFrontPos.x) * rDx + (z - yunhaiFrontPos.z) * rDz) / rLenSq, 0, 1);
      const closestRidgeX = yunhaiFrontPos.x + rDx * rT;
      const closestRidgeZ = yunhaiFrontPos.z + rDz * rT;
      const distToRidge = Math.hypot(x - closestRidgeX, z - closestRidgeZ);
      if (distToRidge < 46.0) {
        const ridgeFactor = 1.0 - THREE.MathUtils.smoothstep(distToRidge, 13.0, 46.0);
        const targetHotelGroundY = yunhaiRidgeMidY + Math.sin(x * 0.04) * 0.6;
        finalH = THREE.MathUtils.lerp(finalH, Math.max(finalH, targetHotelGroundY), ridgeFactor * 0.94);
      }
      const dYunhaiDrop = Math.hypot(x - yunhaiDropCenter.x, z - yunhaiDropCenter.z);
      if (dYunhaiDrop < 65.0) {
        const dropFactor = 1.0 - THREE.MathUtils.smoothstep(dYunhaiDrop, 10.0, 65.0);
        finalH -= 26.0 * dropFactor;
      }

      // 強制套用路面下緣包絡，杜絕任何地形三角形穿進柏油路面
      if (minRoadClearanceY < Infinity) {
        finalH = Math.min(finalH, minRoadClearanceY);
      }

      return finalH;
    }

    function buildTerrainAndCreek() {
      const minX = -1550, maxX = 1850;
      const minZ = -1050, maxZ = 1050;
      const segX = 310, segZ = 195;
      const width = maxX - minX;
      const depth = maxZ - minZ;

      const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
      geo.rotateX(-Math.PI / 2);
      geo.translate((minX + maxX) * 0.5, 0, (minZ + maxZ) * 0.5);

      const posAttr = geo.attributes.position;
      const colors = new Float32Array(posAttr.count * 3);
      const colLowForest = new THREE.Color(0x2f5a27);
      const colMidTea = new THREE.Color(0x4d7c0f);
      const colHighRidge = new THREE.Color(0x3f6212);
      const colRock = new THREE.Color(0x57534e);
      const tmpColor = new THREE.Color();

      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vz = posAttr.getZ(i);
        const vy = getTerrainHeightAt(vx, vz);
        posAttr.setY(i, vy);

        const realElev = vy + BASE_ELEV;
        if (realElev < 460) {
          tmpColor.copy(colLowForest).lerp(colMidTea, (realElev - 300) / 160);
        } else if (realElev < 760) {
          tmpColor.copy(colMidTea).lerp(colHighRidge, (realElev - 460) / 300);
        } else {
          tmpColor.copy(colHighRidge).lerp(colRock, THREE.MathUtils.clamp((realElev - 760) / 220, 0, 0.55));
        }
        const variation = 0.92 + 0.14 * Math.sin(vx * 0.045) * Math.cos(vz * 0.045);
        colors[i * 3] = tmpColor.r * variation;
        colors[i * 3 + 1] = tmpColor.g * variation;
        colors[i * 3 + 2] = tmpColor.b * variation;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.02
      });
      const terrainMesh = new THREE.Mesh(geo, terrainMat);
      terrainMesh.receiveShadow = true;
      scene.add(terrainMesh);

      // 九芎坑溪溪水帶
      const creekGeoPts = [];
      const creekGeoIdx = [];
      for (let i = 0; i < creekSamples.length; i++) {
        const p = creekSamples[i];
        const pNext = creekSamples[Math.min(creekSamples.length - 1, i + 1)];
        const dir = new THREE.Vector3().subVectors(pNext, p).normalize();
        const side = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
        creekGeoPts.push(p.x - side.x * 4.5, p.y - 3.6, p.z - side.z * 4.5);
        creekGeoPts.push(p.x + side.x * 4.5, p.y - 3.6, p.z + side.z * 4.5);
        if (i < creekSamples.length - 1) {
          const v = i * 2;
          creekGeoIdx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2);
        }
      }
      const creekGeo = new THREE.BufferGeometry();
      creekGeo.setAttribute('position', new THREE.Float32BufferAttribute(creekGeoPts, 3));
      creekGeo.setIndex(creekGeoIdx);
      creekGeo.computeVertexNormals();
      const creekMat = new THREE.MeshStandardMaterial({
        color: 0x0ea5e9,
        roughness: 0.25,
        metalness: 0.35
      });
      scene.add(new THREE.Mesh(creekGeo, creekMat));

      // 程序化梅山山林樹群與高海拔茶園灌木（InstancedMesh 高效批次繪製）
      const treeCount = 1350;
      const trunkGeo = new THREE.CylinderGeometry(0.22, 0.36, 3.4, 5);
      const crownGeo = new THREE.ConeGeometry(2.3, 6.2, 6);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 });
      const crownMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.85 });

      const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
      const crownInst = new THREE.InstancedMesh(crownGeo, crownMat, treeCount);
      const dummy = new THREE.Object3D();
      const treeColor = new THREE.Color();
      let placed = 0;
      let attempts = 0;

      while (placed < treeCount && attempts < treeCount * 8) {
        attempts++;
        const refSample = roadSamples[Math.floor(Math.random() * NUM_SAMPLES)];
        const sideSign = Math.random() < 0.5 ? -1 : 1;
        const offset = 11.0 + Math.random() * 145.0;
        const tx = refSample.pos.x + refSample.right.x * sideSign * offset + (Math.random() - 0.5) * 24;
        const tz = refSample.pos.z + refSample.right.z * sideSign * offset + (Math.random() - 0.5) * 24;

        // 確認樹位未落在任何路段上
        const gx = Math.floor(tx / GRID_CELL);
        const gz = Math.floor(tz / GRID_CELL);
        let tooCloseToRoad = false;
        for (let dx = -1; dx <= 1 && !tooCloseToRoad; dx++) {
          for (let dz = -1; dz <= 1 && !tooCloseToRoad; dz++) {
            const b = roadSpatialGrid.get(`${gx + dx},${gz + dz}`);
            if (!b) continue;
            for (let k = 0; k < b.length; k += 2) {
              if (Math.hypot(tx - b[k].x, tz - b[k].z) < 9.2) {
                tooCloseToRoad = true;
                break;
              }
            }
          }
        }
        if (tooCloseToRoad) continue;

        const ty = getTerrainHeightAt(tx, tz);
        const scale = 0.75 + Math.random() * 0.95;

        dummy.position.set(tx, ty + 1.6 * scale, tz);
        dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
        dummy.scale.set(scale, scale, scale);
        dummy.updateMatrix();
        trunkInst.setMatrixAt(placed, dummy.matrix);

        dummy.position.set(tx, ty + 5.4 * scale, tz);
        crownInst.setMatrixAt(placed, dummy.matrix);

        treeColor.setHSL(0.26 + Math.random() * 0.08, 0.58, 0.24 + Math.random() * 0.14);
        crownInst.setColorAt(placed, treeColor);
        placed++;
      }

      trunkInst.count = placed;
      crownInst.count = placed;
      scene.add(trunkInst);
      scene.add(crownInst);

      // 高海拔「群彎」與「平路」一帶的整齊高山烏龍茶園梯田（InstancedMesh）
      const teaRowGeo = new THREE.BoxGeometry(1.15, 0.78, 5.4);
      const teaRowMat = new THREE.MeshStandardMaterial({ color: 0x65a30d, roughness: 0.82 });
      const teaMaxCount = 950;
      const teaInst = new THREE.InstancedMesh(teaRowGeo, teaRowMat, teaMaxCount);
      const teaCol = new THREE.Color();
      let teaPlaced = 0;

      for (let sIdx = 1450; sIdx < NUM_SAMPLES - 60 && teaPlaced < teaMaxCount; sIdx += 7) {
        const rs = roadSamples[sIdx];
        const rowAngle = Math.atan2(rs.flatTangent.x, rs.flatTangent.z);
        [-1, 1].forEach(sideSign => {
          for (let tier = 0; tier < 3 && teaPlaced < teaMaxCount; tier++) {
            const distFromRoad = 12.5 + tier * 4.2 + (Math.random() - 0.5) * 1.2;
            const tx = rs.pos.x + rs.right.x * sideSign * distFromRoad;
            const tz = rs.pos.z + rs.right.z * sideSign * distFromRoad;

            const gx = Math.floor(tx / GRID_CELL);
            const gz = Math.floor(tz / GRID_CELL);
            let nearRoad = false;
            for (let dx = -1; dx <= 1 && !nearRoad; dx++) {
              for (let dz = -1; dz <= 1 && !nearRoad; dz++) {
                const b = roadSpatialGrid.get(`${gx + dx},${gz + dz}`);
                if (!b) continue;
                for (let k = 0; k < b.length; k += 2) {
                  if (Math.hypot(tx - b[k].x, tz - b[k].z) < 8.8) {
                    nearRoad = true;
                    break;
                  }
                }
              }
            }
            if (nearRoad) continue;

            const ty = getTerrainHeightAt(tx, tz);
            dummy.position.set(tx, ty + 0.32, tz);
            dummy.rotation.set(0, rowAngle + (Math.random() - 0.5) * 0.12, 0);
            dummy.scale.set(0.9 + Math.random() * 0.25, 0.85 + Math.random() * 0.3, 0.85 + Math.random() * 0.35);
            dummy.updateMatrix();
            teaInst.setMatrixAt(teaPlaced, dummy.matrix);

            teaCol.setHSL(0.22 + Math.random() * 0.04, 0.72, 0.34 + Math.random() * 0.09);
            teaInst.setColorAt(teaPlaced, teaCol);
            teaPlaced++;
          }
        });
      }
      teaInst.count = teaPlaced;
      scene.add(teaInst);

      // 西側嘉南平原方向遠景山腰雲海層（增添高海拔爬升俯瞰空間感）
      const cloudGroup = new THREE.Group();
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        transparent: true,
        opacity: 0.42,
        roughness: 1.0,
        depthWrite: false
      });
      const cloudGeo = new THREE.DodecahedronGeometry(1, 1);
      for (let c = 0; c < 42; c++) {
        const cm = new THREE.Mesh(cloudGeo, cloudMat);
        const cx = -1350 + Math.random() * 1450;
        const cz = -920 + Math.random() * 1750;
        const cy = 95 + Math.random() * 165;
        cm.position.set(cx, cy, cz);
        cm.scale.set(85 + Math.random() * 130, 8 + Math.random() * 10, 65 + Math.random() * 110);
        cm.rotation.y = Math.random() * Math.PI;
        cloudGroup.add(cm);
      }
      scene.add(cloudGroup);
    }

    buildTerrainAndCreek();

    // =========================================================================
    // 6. 沿線 3D 實景地標、1～36 彎紅色雲朵鐵雕牌、斜向反光鏡與太平雲梯
    // =========================================================================
    const landmarkGroup = new THREE.Group();
    scene.add(landmarkGroup);

    // 6.1 建立第 1～36 彎「紅色雲朵茶樹意象鐵雕牌」＋「斜向橘框凸面反光鏡」
    function createRedCloudBendSculpture(bendNumber, elevMeters) {
      const group = new THREE.Group();
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 512);

      // 底座鋼板
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(72, 486, 112, 16);

      // 紅色茶樹主幹與分枝
      ctx.strokeStyle = '#dc2626';
      ctx.lineCap = 'round';
      ctx.lineWidth = 24;
      ctx.beginPath();
      ctx.moveTo(128, 490);
      ctx.quadraticCurveTo(134, 340, 124, 195);
      ctx.stroke();

      // 左側小雲朵枝條（海拔高度）
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(128, 360);
      ctx.quadraticCurveTo(86, 340, 74, 310);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(58, 304, 15, 0, Math.PI * 2);
      ctx.arc(76, 298, 18, 0, Math.PI * 2);
      ctx.arc(94, 304, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#991b1b';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.round(elevMeters)}m`, 76, 309);

      // 右側茶葉精靈剪影
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(166, 375, 22, 0, Math.PI * 2);
      ctx.fill();

      // 樹冠大型白雲朵
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(88, 166, 30, 0, Math.PI * 2);
      ctx.arc(128, 146, 36, 0, Math.PI * 2);
      ctx.arc(168, 166, 30, 0, Math.PI * 2);
      ctx.arc(112, 178, 28, 0, Math.PI * 2);
      ctx.arc(146, 178, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 頂端紅色大圓牌＋白色彎道編號（1～36）
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(128, 82, 52, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 54px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(bendNumber), 128, 84);

      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        alphaTest: 0.15,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 3.5), mat);
      mesh.position.y = 1.75;
      group.add(mesh);
      return group;
    }

    function createConvexMirrorMesh() {
      const mirrorGroup = new THREE.Group();
      // 鍍鋅鋼管立柱
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.065, 2.75, 8),
        new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.65, roughness: 0.35 })
      );
      pole.position.y = 1.375;
      mirrorGroup.add(pole);

      // 鏡頭旋轉樞紐（朝向來車方向並微向下傾）
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 2.45, 0);

      // 橘色圓形外框
      const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.46, 0.46, 0.08, 24),
        new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.45 })
      );
      rim.rotation.x = Math.PI / 2;
      headGroup.add(rim);

      // 上緣橘色遮陽帽簷
      const visor = new THREE.Mesh(
        new THREE.CylinderGeometry(0.47, 0.47, 0.16, 20, 1, true, -Math.PI * 0.42, Math.PI * 0.84),
        new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.45, side: THREE.DoubleSide })
      );
      visor.rotation.x = Math.PI / 2;
      visor.position.z = 0.05;
      headGroup.add(visor);

      // 銀色凸面反光鏡面
      const glass = new THREE.Mesh(
        new THREE.SphereGeometry(0.41, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.35),
        new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.92, roughness: 0.08 })
      );
      glass.rotation.x = Math.PI / 2;
      glass.position.z = -0.27;
      headGroup.add(glass);

      mirrorGroup.add(headGroup);
      mirrorGroup.userData.head = headGroup;
      return mirrorGroup;
    }

    function buildAll36BendsAndMirrors() {
      bendMarkers.forEach(bm => {
        const s = roadSamples[bm.sampleIndex];
        const prevT = roadSamples[Math.max(0, bm.sampleIndex - 5)].flatTangent;
        const nextT = roadSamples[Math.min(NUM_SAMPLES, bm.sampleIndex + 5)].flatTangent;
        const crossY = prevT.x * nextT.z - prevT.z * nextT.x;
        // 外側懸崖方向：右轉時左側(-1)為外側，左轉時右側(+1)為外側
        const outerSide = crossY > 0 ? -1 : 1;

        // 1. 紅色雲朵茶樹鐵雕牌立於彎心外側路肩
        const sculpture = createRedCloudBendSculpture(bm.bendNum, bm.ele);
        const signPos = s.pos.clone().addScaledVector(s.right, outerSide * (ROAD_HALF_WIDTH + 0.55));
        sculpture.position.copy(signPos);
        const lookTarget = signPos.clone().addScaledVector(s.flatTangent, -12.0).addScaledVector(s.right, -outerSide * 4.0);
        sculpture.lookAt(lookTarget.x, signPos.y, lookTarget.z);
        landmarkGroup.add(sculpture);

        // 2. 彎道外側橘框凸面反光鏡（與道路形成約 42° 夾角面向入彎來車）
        const mirror = createConvexMirrorMesh();
        const mirrorSample = roadSamples[Math.min(NUM_SAMPLES, bm.sampleIndex + 2)];
        const mirrorPos = mirrorSample.pos.clone().addScaledVector(mirrorSample.right, outerSide * (ROAD_HALF_WIDTH + 0.65));
        mirror.position.copy(mirrorPos);
        const mirrorAim = mirrorPos.clone()
          .addScaledVector(mirrorSample.flatTangent, -14.0)
          .addScaledVector(mirrorSample.right, -outerSide * 12.5);
        mirror.userData.head.lookAt(mirrorAim.x, mirrorPos.y + 1.4, mirrorAim.z);
        landmarkGroup.add(mirror);
      });
    }

    buildAll36BendsAndMirrors();

    function createTextBoard(title, subtitle, bgColor = '#1e3a8a', borderColor = '#93c5fd') {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 192;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 512, 192);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, 502, 182);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 38px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 256, 78);

      ctx.fillStyle = '#fef08a';
      ctx.font = '700 24px "Noto Sans TC", sans-serif';
      ctx.fillText(subtitle, 256, 138);

      const tex = new THREE.CanvasTexture(c);
      return new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 1.0, 0.12),
        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 })
      );
    }

    function buildSpecialLandmarks() {
      // 安全檢查：確保任何建築或設施距離全線所有柏油路段至少 10.5 公尺
      function isSafeOffRoad(x, z, minClearance = 10.5) {
        const gx = Math.floor(x / GRID_CELL);
        const gz = Math.floor(z / GRID_CELL);
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            const b = roadSpatialGrid.get(`${gx + dx},${gz + dz}`);
            if (!b) continue;
            for (let k = 0; k < b.length; k++) {
              if (Math.hypot(x - b[k].x, z - b[k].z) < minClearance) return false;
            }
          }
        }
        return true;
      }

      // 輔助函式：建立梅山傳統廟宇（西門大將軍廟、南門大將軍廟）
      function buildMountainTemple(lat, lon, title, subtitle) {
        const wp = gpsToWorld(lat, lon, BASE_ELEV);
        let bestIdx = 0, bestD = Infinity;
        for (let i = 0; i <= NUM_SAMPLES; i++) {
          const d = (roadSamples[i].pos.x - wp.x) ** 2 + (roadSamples[i].pos.z - wp.z) ** 2;
          if (d < bestD) { bestD = d; bestIdx = i; }
        }
        const s = roadSamples[bestIdx];
        const templeGroup = new THREE.Group();
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(5.6, 3.4, 4.4),
          new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.6 })
        );
        wall.position.y = 1.7;
        templeGroup.add(wall);

        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(4.4, 1.9, 4),
          new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.45 })
        );
        roof.position.y = 4.2;
        roof.rotation.y = Math.PI / 4;
        templeGroup.add(roof);

        const plaque = createTextBoard(title, subtitle, '#7f1d1d', '#facc15');
        plaque.scale.set(0.85, 0.65, 1);
        plaque.position.set(0, 2.8, 2.35);
        templeGroup.add(plaque);

        const pos = s.pos.clone().addScaledVector(s.right, -(ROAD_HALF_WIDTH + 6.8));
        templeGroup.position.copy(pos);
        templeGroup.lookAt(s.pos.x, pos.y, s.pos.z);
        landmarkGroup.add(templeGroup);
      }

      // 輔助函式：建立山坡咖啡莊園（清豐咖啡園、溫福良咖啡農場、陳皇仁咖啡）
      function buildCoffeeEstate(lat, lon, name, subtitle) {
        const wp = gpsToWorld(lat, lon, BASE_ELEV);
        let bestIdx = 0, bestD = Infinity;
        for (let i = 0; i <= NUM_SAMPLES; i++) {
          const d = (roadSamples[i].pos.x - wp.x) ** 2 + (roadSamples[i].pos.z - wp.z) ** 2;
          if (d < bestD) { bestD = d; bestIdx = i; }
        }
        const s = roadSamples[bestIdx];
        const sideSign = ((wp.x - s.pos.x) * s.right.x + (wp.z - s.pos.z) * s.right.z) >= 0 ? 1 : -1;
        const basePos = s.pos.clone().addScaledVector(s.right, sideSign * (ROAD_HALF_WIDTH + 9.5));
        if (!isSafeOffRoad(basePos.x, basePos.z, 9.8)) return;

        const g = new THREE.Group();
        const deck = new THREE.Mesh(
          new THREE.BoxGeometry(8.5, 0.5, 6.2),
          new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.85 })
        );
        deck.position.y = 0.25;
        g.add(deck);

        const cabin = new THREE.Mesh(
          new THREE.BoxGeometry(5.2, 3.1, 3.8),
          new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.75 })
        );
        cabin.position.set(0, 1.9, -0.6);
        g.add(cabin);

        const roof = new THREE.Mesh(
          new THREE.ConeGeometry(4.1, 1.5, 4),
          new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 })
        );
        roof.position.set(0, 4.1, -0.6);
        roof.rotation.y = Math.PI / 4;
        g.add(roof);

        const sign = createTextBoard(name, subtitle, '#451a03', '#fb923c');
        sign.scale.set(1.15, 0.95, 1);
        sign.position.set(0, 1.8, 3.4);
        g.add(sign);

        g.position.set(basePos.x, getTerrainHeightAt(basePos.x, basePos.z), basePos.z);
        g.lookAt(s.pos.x, g.position.y, s.pos.z);
        landmarkGroup.add(g);
      }

      // 輔助函式：依衛星圖散布山村聚落群（頂半、半路店、平路聚落）
      function buildHillsideVillage(centerLat, centerLon, houseCount, spreadRadius) {
        const centerWp = gpsToWorld(centerLat, centerLon, BASE_ELEV);
        const wallColors = [0xf8fafc, 0xe2e8f0, 0xfef3c7, 0xd6d3d1];
        const roofColors = [0x991b1b, 0x334155, 0x1e3a8a, 0x7c2d12];

        for (let i = 0; i < houseCount; i++) {
          const angle = (i / houseCount) * Math.PI * 2 + i * 0.7;
          const dist = 10 + (i % 4) * (spreadRadius / 4);
          const hx = centerWp.x + Math.cos(angle) * dist;
          const hz = centerWp.z + Math.sin(angle) * dist;
          if (!isSafeOffRoad(hx, hz, 11.2)) continue;

          const hy = getTerrainHeightAt(hx, hz);
          const house = new THREE.Group();
          const w = 4.2 + (i % 3) * 1.4;
          const h = 3.2 + (i % 2) * 1.8;
          const d = 3.8 + ((i + 1) % 3) * 1.2;

          const body = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            new THREE.MeshStandardMaterial({ color: wallColors[i % wallColors.length], roughness: 0.78 })
          );
          body.position.y = h * 0.5;
          house.add(body);

          const roof = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.5, 0.45, d + 0.5),
            new THREE.MeshStandardMaterial({ color: roofColors[i % roofColors.length], roughness: 0.65 })
          );
          roof.position.y = h + 0.2;
          house.add(roof);

          house.position.set(hx, hy - 0.3, hz);
          house.rotation.y = angle + 0.5;
          landmarkGroup.add(house);
        }
      }

      // A. 起點西門大將軍廟、南門大將軍廟與咖啡莊園帶
      buildMountainTemple(23.56700, 120.57175, '西門大將軍廟', '梅山三十六彎起點守護神');
      buildMountainTemple(23.55918, 120.57983, '南門大將軍廟', '縣道162甲線 · 海拔 441m');
      buildCoffeeEstate(23.56295, 120.57345, '☕ 清豐咖啡園', '梅山精品咖啡 · 賞景休憩');
      buildCoffeeEstate(23.56420, 120.57460, '☕ 溫福良咖啡農場', '九芎坑溪谷 · 莊園手沖');
      buildCoffeeEstate(23.56125, 120.59655, '☕ 陳皇仁咖啡', '太平群彎 · 高山精品咖啡');

      // B. 衛星圖三大山村聚落群：「頂半 / 半路店」與群彎山凹裡的「平路聚落」
      buildHillsideVillage(23.5602, 120.5822, 14, 72); // 頂半聚落
      buildHillsideVillage(23.5582, 120.5852, 12, 65); // 半路店聚落
      buildHillsideVillage(23.5626, 120.5944, 15, 68); // 群彎平路聚落

      // C1. 第 22 彎「阿里山國家風景區牌坊」
      const bm22 = bendMarkers[21];
      if (bm22) {

        const arch22 = new THREE.Group();
        [-1, 1].forEach(side => {

        );

        board22.scale.set(2.3, 0.68, 1);
        board22.position.set(0, 4.55, 0);

        arch22.position.copy(s22.pos);
        arch22.lookAt(s22.pos.clone().add(s22.flatTangent));

      }

      // C2. 第 28 彎「梅山觀景臺」木造懸挑觀景平台
      const bm28 = bendMarkers[27];
      if (bm28) {
        const s28 = roadSamples[bm28.sampleIndex];
        const prev28 = roadSamples[Math.max(0, bm28.sampleIndex - 5)].flatTangent;
        const next28 = roadSamples[Math.min(NUM_SAMPLES, bm28.sampleIndex + 5)].flatTangent;
        const outer28 = (prev28.x * next28.z - prev28.z * next28.x) > 0 ? -1 : 1;

        const deckGroup = new THREE.Group();
        const woodDeck = new THREE.Mesh(
          new THREE.BoxGeometry(7.2, 0.4, 5.6),
          new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.8 })
        );
        woodDeck.position.y = 0.2;
        deckGroup.add(woodDeck);

        const railBar = new THREE.Mesh(
          new THREE.BoxGeometry(7.2, 0.14, 0.14),

        );
        railBar.position.set(0, 1.15, 2.7);
        deckGroup.add(railBar);

        const viewBoard = createTextBoard('梅山觀景臺', '俯瞰嘉南平原與三十六彎全貌', '#1e3a8a', '#38bdf8');
        viewBoard.scale.set(1.05, 0.85, 1);
        viewBoard.position.set(-2.1, 1.45, 2.5);
        deckGroup.add(viewBoard);

        const deckPos = s28.pos.clone().addScaledVector(s28.right, outer28 * (ROAD_HALF_WIDTH + 3.1));
        deckGroup.position.copy(deckPos);
        deckGroup.lookAt(deckPos.clone().addScaledVector(s28.right, outer28 * 10));
        landmarkGroup.add(deckGroup);
      }

      // D. 第 36 彎（太平三十六彎）：雲海大飯店看板、陡峭岩壁駁坎、雲海大飯店建築群、彎心巨石草坡與白漆護欄
      const bm36 = bendMarkers[35];
      if (bm36) {
        const idx36 = bm36.sampleIndex;
        const s36 = roadSamples[idx36];
        const prevT = roadSamples[Math.max(0, idx36 - 6)].flatTangent;
        const nextT = roadSamples[Math.min(NUM_SAMPLES, idx36 + 6)].flatTangent;
        const crossY = prevT.x * nextT.z - prevT.z * nextT.x;
        const outerSide = crossY > 0 ? -1 : 1; // 外側（入彎左側護欄、看板與岩壁側）
        const innerSide = -outerSide;           // 內側（右側彎心巨石草坡側）
        const entrySample = roadSamples[Math.max(0, idx36 - 8)];
        const exitSample = roadSamples[Math.min(NUM_SAMPLES, idx36 + 8)];

        // D1. 右側彎心草坡槽化島、三塊天然巨石、水泥排水矮牆與歪斜古松（精準計算與入／出彎雙向道路的安全距離）
        const innerBisector = new THREE.Vector3()
          .addVectors(entrySample.right.clone().multiplyScalar(innerSide), exitSample.right.clone().multiplyScalar(innerSide))
          .normalize();
        const islandCenter = s36.pos.clone().addScaledVector(innerBisector, ROAD_HALF_WIDTH + 7.6);
        const islandMound = new THREE.Mesh(
          new THREE.SphereGeometry(5.6, 20, 14),
          new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.92 })
        );
        islandMound.scale.set(1.15, 0.38, 1.0);
        islandMound.position.copy(islandCenter);
        landmarkGroup.add(islandMound);

        // 草坡上的三塊天然巨石（對應照片右下角巨石堆）
        const boulderMat = new THREE.MeshStandardMaterial({ color: 0x57534e, roughness: 0.95 });
        [
          { dx: 1.6, dz: 2.2, r: 1.35, sy: 1.15 },
          { dx: -0.4, dz: 1.4, r: 0.85, sy: 0.8 },
          { dx: 0.9, dz: 0.1, r: 0.72, sy: 0.75 }
        ].forEach(b => {
          const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(b.r, 1), boulderMat);
          rock.scale.set(1.2, b.sy, 1.0);
          rock.position.copy(islandCenter)
            .addScaledVector(s36.right, innerSide * b.dx)
            .addScaledVector(s36.flatTangent, -b.dz);
          rock.position.y += b.r * 0.65;
          rock.rotation.set(0.3, b.dx * 1.4, 0.2);
          landmarkGroup.add(rock);
        });

        const curbWall = new THREE.Mesh(
          new THREE.BoxGeometry(3.2, 0.85, 0.42),
          new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.88 })
        );
        curbWall.position.copy(islandCenter).addScaledVector(innerBisector, -4.6);
        curbWall.position.y += 0.42;
        curbWall.lookAt(s36.pos);
        landmarkGroup.add(curbWall);

        // 彎心歪斜古松樹
        const pineGroup = new THREE.Group();
        const pineTrunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.26, 2.8, 7),
          new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 })
        );
        pineTrunk.position.y = 1.3;
        pineTrunk.rotation.z = 0.22;
        pineGroup.add(pineTrunk);
        const pineCrown = new THREE.Mesh(
          new THREE.DodecahedronGeometry(2.1, 1),
          new THREE.MeshStandardMaterial({ color: 0x365314, roughness: 0.88 })
        );
        pineCrown.scale.set(1.35, 0.78, 1.2);
        pineCrown.position.set(-0.35, 2.9, 0);
        pineGroup.add(pineCrown);
        pineGroup.position.copy(islandCenter).addScaledVector(innerBisector, -1.6);
        pineGroup.position.y += 1.0;
        landmarkGroup.add(pineGroup);

        // D2. 繞過第 36 彎彎心至出彎外側的白底黑黃斜紋水泥護欄、雙連箭頭牌、旗桿與「雲海大飯店 Welcome」大型看板
        const barrierPts = [];
        for (let bIdx = -3; bIdx <= 5; bIdx++) {
          const bs = roadSamples[THREE.MathUtils.clamp(idx36 + bIdx, 0, NUM_SAMPLES)];
          const bp = bs.pos.clone().addScaledVector(bs.right, outerSide * (ROAD_HALF_WIDTH + 0.35));
          barrierPts.push(bp);
        }
        for (let i = 0; i < barrierPts.length - 1; i++) {
          const p0 = barrierPts[i];
          const p1 = barrierPts[i + 1];
          const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
          const len = p0.distanceTo(p1);
          const jersey = new THREE.Mesh(
            new THREE.BoxGeometry(0.45, 0.85, len + 0.08),
            new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.75 })
          );
          jersey.position.copy(mid);
          jersey.position.y += 0.42;
          jersey.lookAt(p1.x, mid.y + 0.42, p1.z);
          landmarkGroup.add(jersey);

          const stripe = new THREE.Mesh(
            new THREE.BoxGeometry(0.48, 0.22, len * 0.45),
            new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xfacc15 : 0x1e293b })
          );
          stripe.position.copy(mid);
          stripe.position.y += 0.68;
          stripe.lookAt(p1.x, mid.y + 0.68, p1.z);
          landmarkGroup.add(stripe);
        }
        // 看板、岩壁與雲海大飯店皆位於「轉過第 36 彎後」的出彎左側路緣與岩壁上方（實測 GPS 定位）
        const postApexSample = roadSamples[Math.min(NUM_SAMPLES, idx36 + 5)];
        const exitTangent = postApexSample.flatTangent;
        const exitNorthNormal = postApexSample.right.clone().multiplyScalar(outerSide);
        const signBasePos = postApexSample.pos.clone()
          .addScaledVector(exitNorthNormal, ROAD_HALF_WIDTH + 1.45);

        const hotelCanvas = document.createElement('canvas');
        hotelCanvas.width = 512;
        hotelCanvas.height = 320;
        const hctx = hotelCanvas.getContext('2d');
        const grad = hctx.createLinearGradient(0, 0, 0, 220);
        grad.addColorStop(0, '#0284c7');
        grad.addColorStop(1, '#bae6fd');
        hctx.fillStyle = grad;
        hctx.fillRect(0, 0, 512, 320);
        hctx.fillStyle = '#f8fafc';
        hctx.fillRect(0, 220, 512, 100);
        hctx.strokeStyle = '#ffffff';
        hctx.lineWidth = 10;
        hctx.strokeRect(5, 5, 502, 310);

        hctx.fillStyle = '#0c4a6e';
        hctx.font = '900 44px "Noto Sans TC", sans-serif';
        hctx.fillText('雲海大飯店', 34, 72);
        hctx.fillStyle = '#dc2626';
        hctx.font = '900 28px Inter, sans-serif';
        hctx.fillText('Welcome', 36, 114);

        hctx.fillStyle = '#e2e8f0';
        hctx.fillRect(305, 55, 175, 145);
        hctx.fillStyle = '#1d4ed8';
        for (let col = 0; col < 5; col++) hctx.fillRect(315 + col * 36, 65, 10, 130);

        hctx.fillStyle = '#dc2626';
        hctx.fillRect(24, 236, 170, 56);
        hctx.fillStyle = '#ffffff';
        hctx.font = 'bold 20px sans-serif';
        hctx.fillText('TEL: 2571673', 34, 272);
        hctx.fillStyle = '#1e293b';
        hctx.font = 'bold 21px "Noto Sans TC", sans-serif';
        hctx.fillText('渡假 · 會議 · 山產部 · 聚餐 · 住宿', 208, 268);

        const hotelBoardTex = new THREE.CanvasTexture(hotelCanvas);
        const hotelBoardGroup = new THREE.Group();
        const boardMesh = new THREE.Mesh(
          new THREE.BoxGeometry(4.8, 3.0, 0.14),
          new THREE.MeshStandardMaterial({ map: hotelBoardTex, roughness: 0.35 })
        );
        boardMesh.position.y = 2.75;
        hotelBoardGroup.add(boardMesh);
        [-1.9, 0, 1.9].forEach(lx => {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.055, 0.055, 2.1, 6),
            new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7 })
          );
          leg.position.set(lx, 1.05, 0);
          hotelBoardGroup.add(leg);
        });
        hotelBoardGroup.position.copy(signBasePos);
        const apexLook = signBasePos.clone()
          .addScaledVector(postApexSample.flatTangent, -18.0)
          .addScaledVector(postApexSample.right, innerSide * 3.2);
        apexLook.y = signBasePos.y;
        hotelBoardGroup.lookAt(apexLook);
        landmarkGroup.add(hotelBoardGroup);

        // 看板前方（靠近彎心處）黑黃箭頭牌與紫色旗幟
        const preSignPos = signBasePos.clone()
          .addScaledVector(postApexSample.flatTangent, -4.2)
          .addScaledVector(postApexSample.right, innerSide * 0.35);
        const chevronPole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.05, 2.5, 6),
          new THREE.MeshStandardMaterial({ color: 0x94a3b8 })
        );
        chevronPole.position.copy(preSignPos);
        chevronPole.position.y += 1.25;
        landmarkGroup.add(chevronPole);

        const chevronBox = new THREE.Mesh(
          new THREE.BoxGeometry(1.05, 0.85, 0.1),
          new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 })
        );
        chevronBox.position.copy(preSignPos);
        chevronBox.position.y += 2.0;
        chevronBox.lookAt(apexLook);
        landmarkGroup.add(chevronBox);

        const flagPole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.04, 3.8, 6),
          new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
        );
        flagPole.position.copy(preSignPos).addScaledVector(exitTangent, 0.8);
        flagPole.position.y += 1.9;
        landmarkGroup.add(flagPole);

        const purpleFlag = new THREE.Mesh(
          new THREE.BoxGeometry(0.65, 0.42, 0.04),
          new THREE.MeshStandardMaterial({ color: 0x9333ea, roughness: 0.6 })
        );
        purpleFlag.position.copy(flagPole.position).add(new THREE.Vector3(0, 1.55, 0)).addScaledVector(exitTangent, 0.32);
        purpleFlag.lookAt(apexLook.x, purpleFlag.position.y, apexLook.z);
        landmarkGroup.add(purpleFlag);

        // D3. 緊貼看板後方至出彎左側的陡峭岩壁駁坎（支撐雲海大飯店主樓）
        const cliffSpanLen = yunhaiFrontPos.distanceTo(yunhaiWingEndPos) + 18.0;
        const cliffMid = new THREE.Vector3().addVectors(yunhaiFrontPos, yunhaiWingEndPos).multiplyScalar(0.5);
        const cliffEmbankment = new THREE.Mesh(
          new THREE.BoxGeometry(cliffSpanLen, 10.6, 15.0),
          new THREE.MeshStandardMaterial({ color: 0x44403c, roughness: 0.96 })
        );
        cliffEmbankment.position.copy(cliffMid).addScaledVector(exitNorthNormal, -3.5);
        cliffEmbankment.position.y = yunhaiRidgeMidY - 5.3;
        const exitYaw = Math.atan2(exitTangent.x, exitTangent.z);
        cliffEmbankment.rotation.y = exitYaw + Math.PI / 2;
        landmarkGroup.add(cliffEmbankment);

        // 岩壁腳白色帆布頂棚小鐵架（緊貼看板右側、岩壁腳邊）
        const canopySample = roadSamples[Math.min(NUM_SAMPLES, idx36 + 8)];
        const canopyPos = canopySample.pos.clone()
          .addScaledVector(canopySample.right, outerSide * (ROAD_HALF_WIDTH + 1.45));
        const canopyGroup = new THREE.Group();
        const canopyTop = new THREE.Mesh(
          new THREE.BoxGeometry(2.6, 0.35, 1.2),
          new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 })
        );
        canopyTop.position.y = 2.25;
        canopyGroup.add(canopyTop);
        [-1.2, 1.2].forEach(cx => {
          [-0.5, 0.5].forEach(cz => {
            const leg = new THREE.Mesh(
              new THREE.CylinderGeometry(0.03, 0.03, 2.2, 5),
              new THREE.MeshStandardMaterial({ color: 0x94a3b8 })
            );
            leg.position.set(cx, 1.1, cz);
            canopyGroup.add(leg);
          });
        });
        canopyGroup.position.copy(canopyPos);
        canopyGroup.lookAt(apexLook);
        landmarkGroup.add(canopyGroup);

        // D4. 平行貼齊出彎長直道的「雲海大飯店」完整園區（停車廣場＋斜坡聯絡道＋左側藍柱主樓＋右側淺藍長條客房棟）
        const hotelComplex = new THREE.Group();
        const blueColMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.48 });
        const skyRoofMat = new THREE.MeshStandardMaterial({ color: 0x7dd3fc, roughness: 0.42 });
        const wallWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.62 });
        const glassBandMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.65, roughness: 0.2 });
        const eaveMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.52 });

        // 前方停車廣場平台與斜坡聯絡道（平行貼在主樓前方與長直道之間）
        const parkingDeck = new THREE.Mesh(
          new THREE.BoxGeometry(44.0, 0.6, 11.5),
          new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.88 })
        );
        parkingDeck.position.set(4.0, -0.2, 8.2);
        hotelComplex.add(parkingDeck);

        // 停車格白線
        for (let pSlot = -14; pSlot <= 4; pSlot += 2.6) {
          const line = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, 0.06, 4.2),
            new THREE.MeshBasicMaterial({ color: 0xf8fafc })
          );
          line.position.set(pSlot, 0.12, 8.8);
          hotelComplex.add(line);
        }

        // 左側主樓（兩層樓、寶藍柱列、白色弧形大屋頂＋淺藍采光屋頂）
        const frontPavilion = new THREE.Group();
        const bodyWall = new THREE.Mesh(new THREE.BoxGeometry(18.5, 7.6, 9.2), wallWhiteMat);
        bodyWall.position.y = 3.8;
        frontPavilion.add(bodyWall);

        for (let cIdx = 0; cIdx < 7; cIdx++) {
          const cx = -8.4 + cIdx * 2.8;
          const col = new THREE.Mesh(new THREE.BoxGeometry(0.62, 7.6, 0.65), blueColMat);
          col.position.set(cx, 3.8, 4.65);
          frontPavilion.add(col);
        }

        [2.2, 5.6].forEach(wy => {
          const winBand = new THREE.Mesh(new THREE.BoxGeometry(17.4, 1.9, 0.22), glassBandMat);
          winBand.position.set(0, wy, 4.58);
          frontPavilion.add(winBand);
        });

        [4.0, 7.7].forEach(ey => {
          const eave = new THREE.Mesh(new THREE.BoxGeometry(19.6, 0.45, 10.2), eaveMat);
          eave.position.set(0, ey, 0.2);
          frontPavilion.add(eave);
        });

        // 白色＋淺藍雙層屋頂（對應空拍圖左側白藍相間大屋頂）
        const whiteRoofCap = new THREE.Mesh(new THREE.BoxGeometry(18.8, 0.75, 9.6), wallWhiteMat);
        whiteRoofCap.position.set(0, 8.25, 0.2);
        frontPavilion.add(whiteRoofCap);
        const blueSkylight = new THREE.Mesh(new THREE.BoxGeometry(14.5, 0.5, 4.2), skyRoofMat);
        blueSkylight.position.set(1.5, 8.75, -1.8);
        frontPavilion.add(blueSkylight);

        frontPavilion.position.set(-10.5, 0, 0);
        hotelComplex.add(frontPavilion);

        // 右側長條三層樓客房主棟（沿出彎長直道向右延伸，淺藍屋頂與陽台立面）
        const longWing = new THREE.Group();
        const wingBody = new THREE.Mesh(new THREE.BoxGeometry(26.0, 9.2, 8.2), wallWhiteMat);
        wingBody.position.y = 4.6;
        longWing.add(wingBody);

        for (let floor = 0; floor < 3; floor++) {
          const fy = 1.9 + floor * 2.7;
          const darkRecess = new THREE.Mesh(new THREE.BoxGeometry(24.6, 1.5, 0.25), glassBandMat);
          darkRecess.position.set(0, fy + 0.35, 4.05);
          longWing.add(darkRecess);

          const balconyRail = new THREE.Mesh(new THREE.BoxGeometry(25.4, 0.82, 0.35), wallWhiteMat);
          balconyRail.position.set(0, fy - 0.52, 4.25);
          longWing.add(balconyRail);
        }
        for (let bCol = 0; bCol <= 8; bCol++) {
          const bx = -12.0 + bCol * 3.0;
